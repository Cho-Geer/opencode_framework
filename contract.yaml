          authorization: ["ADMIN", "SUPER_ADMIN"]
          content_type: "multipart/form-data"
          description: "Upload service image. Returns the image URL."
          rate_limit: "30次/分钟/IP"
          request:
            body:
              type: "multipart/form-data"
              properties:
                image:
                  type: "file"
                  required: true
                  description: "Service image file (JPEG, PNG, WEBP; max 5MB)"
          response:
            success:
              status: 200
              body:
                type: "object"
                properties:
                 image_url:
                     type: "string"
                     description: "Uploaded image URL"
          
         affected_appointments:
