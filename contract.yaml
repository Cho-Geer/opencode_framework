# ============================================
# 1. Project Information (info)
# ============================================

project:
  name: "booking-system"
  version: "1.0.0"
  description: "Appointment booking system with NestJS backend and Angular frontend"
  repository: "."

  technology_stack:
    backend:
      framework: "NestJS v11+"
      runtime: "Node.js 22.x"
      language: "TypeScript 5.x"
      orm: "Prisma 7.x"
      authentication: "JWT + Passport"
    frontend:
      framework: "Angular v21+"
      state_management: "NgRx SignalStore"
      ui_library: "PrimeNG + Tailwind CSS v4"
    database:
      primary: "PostgreSQL 16"
      cache: "Redis 7.x"
      queue: "BullMQ"
    deployment:
      container: "Docker Compose v2"
      ci_cd: "GitHub Actions"

# ============================================
# 2. API Contract (paths)
# ============================================

api:
  openapi: "3.0.3"
  base_path: "/v1"
  versioning_strategy: "URI path versioning"
  default_content_type: "application/json"

  authentication:
    type: "JWT Bearer Token"
    token_lifetime: "15 minutes"
    refresh_token_lifetime: "7 days"

  # Global response envelope applied by ResponseInterceptor
  response_envelope:
    success:
      statusCode: "integer"
      message: "string"
      data: "<T>"
      timestamp: "string (ISO 8601)"
      requestId: "string (UUID v4)"
    paginated:
      data:
        items: "T[]"
        meta: "{ total, page, limit, totalPages, hasNext, hasPrev }"

  paths:
    # Auth endpoints
    auth:
      login_password: { method: POST, path: /auth/login/password }
      login_send_code: { method: POST, path: /auth/login/send-code }
      login_verify_code: { method: POST, path: /auth/login/verify-code }
      register_send_code: { method: POST, path: /auth/register/send-code }
      register_complete: { method: POST, path: /auth/register/complete }
      reset_password_send_code:
        { method: POST, path: /auth/reset-password/send-code }
      reset_password_verify: { method: POST, path: /auth/reset-password/verify }
      refresh: { method: POST, path: /auth/refresh }
      logout: { method: POST, path: /auth/logout }

    # User endpoints
    users:
      get_profile: { method: GET, path: /users/profile }
      update_profile: { method: PUT, path: /users/profile }
      update_password: { method: PUT, path: /users/profile/password }
      update_timezone: { method: PATCH, path: /users/profile/timezone }

    # Appointment endpoints
    appointments:
      list: { method: GET, path: /appointments }
      create: { method: POST, path: /appointments }
      get_by_id: { method: GET, path: /appointments/:id }
      cancel: { method: POST, path: /appointments/:id/cancel }

    # Time slot endpoints
    time_slots:
      available: { method: GET, path: /time-slots/available }

    # Service endpoints (public)
    services:
      list_public: { method: GET, path: /services }

    # Admin endpoints
    admin:
      stats: { method: GET, path: /admin/stats }
      users:
        list: { method: GET, path: /admin/users }
        get_by_id: { method: GET, path: /admin/users/:id }
        create: { method: POST, path: /admin/users }
        update: { method: PUT, path: /admin/users/:id }
        delete: { method: DELETE, path: /admin/users/:id }
        send_code: { method: POST, path: /admin/users/send-code }
      services:
        list: { method: GET, path: /admin/services }
        get_by_id: { method: GET, path: /admin/services/:id }
        create: { method: POST, path: /admin/services }
        update: { method: PUT, path: /admin/services/:id }
        delete: { method: DELETE, path: /admin/services/:id }
        summary: { method: GET, path: /admin/services/summary }
        affected_appointments:
          { method: GET, path: /admin/services/:id/affected-appointments }
      appointments:
        list: { method: GET, path: /admin/appointments }
        get_by_id: { method: GET, path: /admin/appointments/:id }
        create: { method: POST, path: /admin/appointments }
        update: { method: PUT, path: /admin/appointments/:id }
        cancel: { method: POST, path: /admin/appointments/:id/cancel }
      messages:
        list: { method: GET, path: /admin/messages }
        unread_count: { method: GET, path: /admin/messages/unread-count }
      notifications:
        list: { method: GET, path: /admin/notifications }
        mark_read: { method: POST, path: /admin/notifications/:id/read }
      settings:
        get_business_hours:
          { method: GET, path: /admin/settings/business-hours }
        update_business_hours:
          { method: PUT, path: /admin/settings/business-hours }
      translations:
        list: { method: GET, path: /admin/translations }
        update: { method: PUT, path: /admin/translations }
        delete: { method: DELETE, path: /admin/translations/:id }
        seed: { method: POST, path: /admin/translations/seed }
      system:
        health: { method: GET, path: /admin/system/health }

    # Public translations
    translations:
      list: { method: GET, path: /translations }

# ============================================
# 3. Components (data models, security schemes)
# ============================================

components:
  security_schemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"

  schemas:
    # Core data models (detailed definitions in booking_system_refactor/contract.yaml)
    User:
      description: "User account with PII encryption (email/phone)"
      pii_encryption: "email → emailHash|emailEncrypted, phone → phoneHash|phoneEncrypted"

    Appointment:
      description: "Booking appointment record"

    Service:
      description: "Available service with pricing and category"

    TimeSlot:
      description: "Available time slot for booking"

    Message:
      description: "Message record for admin inbox"

    Notification:
      description: "Notification record for admin notification bell"

