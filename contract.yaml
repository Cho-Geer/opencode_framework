            domain: { type: "string", required: false }
            locale: { type: "string", required: false }
            search: { type: "string", required: false, description: "搜索 key 或 value" }
          response:
            success:
              status: 200
              body:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id: { type: "string" }
                        domain: { type: "string" }
                        key: { type: "string" }
                        value: { type: "string" }
                        locale: { type: "string" }
                        isCustom: { type: "boolean" }
                        createdAt: { type: "string", format: "date-time" }
                        updatedAt: { type: "string", format: "date-time" }
                  total: { type: "integer" }
                  page: { type: "integer" }
                  limit: { type: "integer" }

        update:
          method: "PUT"
          path: "/v1/admin/translations"
          authentication: true
          authorization: ["ADMIN", "SUPER_ADMIN"]
          rate_limit: "30次/分钟/IP"
          description: "批量更新翻译条目（创建新条目或覆盖现有条目）"
          request:
            body:
              type: "array"
              items:
                type: "object"
                properties:
                  id: { type: "string", description: "更新已有条目时传入（新条目不传）" }
                  domain: { type: "string", required: true }
                  key: { type: "string", required: true }
                  value: { type: "string", required: true }
                  locale: { type: "string", required: true, default: "zh-CN" }
          response:
            success:
              status: 200
              body:
                type: "object"
                properties:
                  updated: { type: "integer", description: "更新条目数" }
                  created: { type: "integer", description: "新建条目数" }

        delete:
          method: "DELETE"
          path: "/v1/admin/translations/:id"
          authentication: true
          authorization: ["ADMIN", "SUPER_ADMIN"]
          rate_limit: "30次/分钟/IP"
          description: "删除指定翻译条目（系统默认条目不可删除）"
          response:
            success:
              status: 204

        seed:
          method: "POST"
          path: "/v1/admin/translations/seed"
          authentication: true
          authorization: ["SUPER_ADMIN"]
          rate_limit: "10次/分钟/IP"
          description: "初始化/重置翻译字典数据（从默认模板填充，仅 SUPER_ADMIN）"
          response:
            success:
              status: 200
              body:
                type: "object"
                properties:
                  message: { type: "string", example: "翻译字典已初始化" }
                  count: { type: "integer", description: "创建的条目数" }

  error_responses:
    format:
      type: "object"
      properties:
        statusCode: { type: "integer" }
        message: { type: "string" }
        error: { type: "string" }
        timestamp: { type: "string", format: "date-time" }
        path: { type: "string" }
    
    status_codes:
      400: "Bad Request - Validation error"
      401: "Unauthorized - Authentication required"
      403: "Forbidden - Insufficient permissions"
      404: "Not Found - Resource not found"
      409: "Conflict - Resource conflict (e.g., time slot already booked)"
      429: "Too Many Requests - Rate limit exceeded"
      500: "Internal Server Error"

# ============================================
# 3. Data Model Contract
# ============================================

data_models:
  
  # User model (PII 三字段模型 - 方案 C v4)
  user:
    description: "System user with authentication and PII-encrypted profile"
    fields:
      id:
        type: "string"
        format: "uuid"
        primary_key: true
      name:
        type: "string"
        required: true
        description: "用户姓名"
      
      # Phone 三字段（PII 加密）
      phone:
        type: "string (nullable)"
        description: "脱敏掩码（如 138****5678）"
        unique: false
      phoneHash:
        type: "string (nullable)"
        description: "SHA-256(phone_plaintext + PII_HASH_PEPPER)"
        unique: true
        sensitive: true
      phoneEncrypted:
        type: "string (nullable)"
        description: "AES-256-GCM 密文"
        sensitive: true
      
      # Email 三字段（PII 加密）
      email:
        type: "string (nullable)"
        description: "脱敏掩码（如 us***@example.com）"
        unique: false
      emailHash:
        type: "string (nullable)"
        description: "SHA-256(email_plaintext + PII_HASH_PEPPER)"
        unique: true
        sensitive: true
      emailEncrypted:
        type: "string (nullable)"
        description: "AES-256-GCM 密文"
        sensitive: true
      
      passwordHash:
        type: "string"
        nullable: true
        sensitive: true
        description: "bcrypt 哈希（rounds=12）。验证码登录用户可能为 null（仅密码登录用户有值）"
      
      role:
        type: "string"
        enum: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"]
        default: "CUSTOMER"
      status:
        type: "string"
        enum: ["ACTIVE", "INACTIVE", "BLOCKED"]
        default: "ACTIVE"
      lastLoginAt:
        type: "datetime"
        nullable: true
      preferredTimezone:
        type: "string"
        nullable: true
        description: "IANA 时区字符串（如 Asia/Shanghai），用户偏好时区，由前端 Intl API 自动检测并提交，可在个人设置中手动修改"
      deviceInfo:
        type: "json"
        nullable: true
      remarks:
        type: "text"
        nullable: true
      createdAt:
        type: "datetime"
        default: "now()"
      updatedAt:
        type: "datetime"
        default: "now()"
        auto_update: true
    
    indexes:
      - fields: ["emailHash"]
        unique: true
      - fields: ["phoneHash"]
        unique: true
      - fields: ["role", "status"]
      - fields: ["createdAt"]
      - fields: ["lastLoginAt"]
    
    relationships:
      sessions: { type: "has_many", target: "user_session" }
      appointments: { type: "has_many", target: "appointment" }
      notifications: { type: "has_many", target: "notification" }
      activityLogs: { type: "has_many", target: "activity_log" }
  
  # Service model
  service:
    description: "Service offered by the business"
    fields:
      id:
        type: "string"
        format: "uuid"
        primary_key: true
      name:
        type: "string"
        required: true
      description:
        type: "string"
      duration:
        type: "integer"
        description: "Duration in minutes"
        required: true
      price:
        type: "decimal"
        precision: 10
        scale: 2
        # ⚠️ Known deviation (Tech Debt TICKET-001): Backend currently returns `string` type.
        # Planned fix version: v2.0.0. See 12-admin-services.md for frontend workaround.
      pricePerMinute:
        type: "decimal"
        precision: 10
        scale: 2
        description: "Unit price per minute"
      taxRate:
        type: "decimal"
        precision: 5
        scale: 4
        description: >
          Default tax rate for this service.
          ⚠️ WIRE vs DB: API sends/receives PERCENTAGE (e.g. 8 = 8%).
          DB stores DECIMAL FRACTION (e.g. 0.08). Mapper: ÷100 input, ×100 output.
          DB range: 0.0000 to 9.9999 (0% to 999.99%).
        categoryId:
          type: "string"
          format: "uuid"
          nullable: true
          description: "Service category ID (ServiceCategory)"
          note: "⚠️ Contract defines nullable:true, but Prisma schema has categoryId as required (String). Must change to String? to align with contract."
      imageUrl:
        type: "string"
        nullable: true
        description: "Service image URL"
      displayOrder:
        type: "integer"
        default: 0
        description: "Display sort order"
      active:
        type: "boolean"
        default: true
      created_at:
        type: "datetime"
        default: "now()"
      updated_at:
        type: "datetime"
        default: "now()"
        auto_update: true
    
    indexes:
      - fields: ["name"]
      - fields: ["categoryId"]
      - fields: ["isActive"]
      - fields: ["displayOrder"]
      - fields: ["categoryId", "isActive"]
      - fields: ["price"]
    
    relationships:
      category: { type: "belongs_to", target: "service_category" }
      time_slots: { type: "has_many", target: "time_slot" }
      appointments: { type: "has_many", target: "appointment" }
  
  # Time slot model
  time_slot:
    description: "Available time slot for appointments"
    fields:
      id:
        type: "string"
        format: "uuid"
        primary_key: true
      service_id:
        type: "string"
        format: "uuid"
        required: true
      start_time:
        type: "datetime"
        required: true
      end_time:
        type: "datetime"
        required: true
      capacity:
        type: "integer"
        default: 1
        description: "Maximum number of simultaneous appointments"
      current_sequence:
        type: "integer"
        default: 0
        description: "Current sequence number for atomic booking"
      created_at:
        type: "datetime"
        default: "now()"
      updated_at:
        type: "datetime"
        default: "now()"
        auto_update: true
      isActive:
        type: "boolean"
        default: true
        description: "时段是否启用（软删除标记）"
    
    indexes:
      - fields: ["service_id", "start_time", "end_time"]
      - fields: ["start_time"]
      - fields: ["capacity", "current_sequence"]
      - fields: ["isActive"]
    
    # Note: isActive field exists in Prisma but was undocumented
    # Note: max_overtime_minutes (visible in time-slots/available response) is
    # a computed field calculated by the application layer based on adjacent
    # time slot intervals. It is NOT a persisted database column.
    relationships:
      service: { type: "belongs_to", target: "service" }
      appointments: { type: "has_many", target: "appointment" }
  
  # Appointment model (formerly Booking)
  appointment:
    description: "Appointment booking with high-concurrency handling"
    fields:
      id:
        type: "string"
        format: "uuid"
        primary_key: true
      userId:
        type: "string"
        format: "uuid"
        required: true
      timeSlotId:
        type: "string"
        format: "uuid"
        required: true
      serviceId:
        type: "string"
        format: "uuid"
        required: true
      appointmentNumber:
        type: "string"
        unique: true
        description: "Unique appointment number"
      appointmentDate:
        type: "datetime"
        required: true
      slotSequence:
        type: "integer"
        default: 0
        description: "Sequence number for atomic booking"
      durationMinutes:
        type: "integer"
        default: 30
        description: "Appointment duration in minutes"
      price:
        type: "decimal"
        precision: 10
        scale: 2
        description: "Price snapshot at booking time"
        # ⚠️ Known deviation (Tech Debt TICKET-001): Backend currently returns `string` type.
        # Planned fix version: v2.0.0. See 12-admin-services.md for frontend workaround.
      taxRate:
        type: "decimal"
        precision: 5
        scale: 4
        description: >
          Tax rate snapshot from Service at booking time.
          ⚠️ Same wire-vs-DB convention as Service.taxRate: API wire = percentage,
          DB = decimal fraction. Snapshot taken from Service.taxRate at booking creation.
      taxIncludedAmount:
        type: "decimal"
        precision: 10
        scale: 2
        description: "Total amount including tax (price * (1 + taxRate))"
      status:
        type: "string"
        enum: ["PENDING", "CONFIRMED", "CANCELLED", "COMPLETED", "EXPIRED"]
        default: "PENDING"
      customerInfo:
        type: "json"
        description: "Customer information (JSON format)"
      remarks:
        type: "text"
      createdAt:
        type: "datetime"
        default: "now()"
      updatedAt:
        type: "datetime"
        default: "now()"
        auto_update: true
    
    indexes:
      # Core partial unique index for high-concurrency handling
      - fields: ["timeSlotId", "appointmentDate", "slotSequence"]
        unique: true
        map: "appointment_slot_occupied"
        condition: "status IN ('PENDING', 'CONFIRMED', 'COMPLETED')"
      - fields: ["userId", "appointmentDate"]
      - fields: ["timeSlotId", "appointmentDate", "status"]
      - fields: ["appointmentNumber"]
      - fields: ["status", "appointmentDate"]
    
    relationships:
      user: { type: "belongs_to", target: "user" }
      timeSlot: { type: "belongs_to", target: "time_slot" }
      service: { type: "belongs_to", target: "service" }
      histories: { type: "has_many", target: "appointment_history" }
      notifications: { type: "has_many", target: "notification" }

  # Translation Dictionary model (v1.7.7新增)
  translation_dictionary:
    description: "前端 UI 翻译字典条目，用于国际化和多语言支持"
    fields:
      id:
        type: "string"
        format: "uuid"
        primary_key: true
      domain:
        type: "string"
        required: true
        description: "翻译所属域（如 global, auth, booking, admin 等）"
      key:
        type: "string"
        required: true
        description: "翻译键（域内唯一，如 login.title, save.button）"
      locale:
        type: "string"
        required: true
        default: "en"
        description: "BCP 47 语言标签（如 en, zh-CN, ja）"
      value:
        type: "string"
        required: true
        description: "翻译文本值"
      isCustom:
        type: "boolean"
        default: false
        description: "是否为自定义覆盖条目（false 为系统默认条目）"
      tenantId:
        type: "string"
        format: "uuid"
        nullable: true
        description: "多租户场景下的租户 ID（单租户为 null）"
      createdAt:
        type: "datetime"
        default: "now()"
      updatedAt:
        type: "datetime"
        default: "now()"
        auto_update: true

    indexes:
      - fields: ["domain", "key", "locale", "tenantId"]
        unique: true
      - fields: ["domain", "key"]
      - fields: ["locale"]

# ============================================
# 3.1 Appointment State Machine
# ============================================

appointment_state_machine:
  description: "Authority source for Appointment status transitions"
  states:
    PENDING: "初始状态 — 预约已创建但未确认"
    CONFIRMED: "管理员手动确认预约"
    CANCELLED: "预约已取消（可由客户或管理员操作）"
    COMPLETED: "预约已按时完成"
    EXPIRED: "预约已过期（未确认且超过预约时间）"
  transitions:
    - from: PENDING
      to: [CONFIRMED, CANCELLED, EXPIRED]
    - from: CONFIRMED
      to: [CANCELLED, COMPLETED]
    - from: CANCELLED
      to: []
    - from: COMPLETED
      to: []
    - from: EXPIRED
      to: []

# ============================================
# 4. High-Concurrency Contract
# ============================================

high_concurrency:
  mechanism: "PostgreSQL Partial Unique Index + slot_sequence"
  description: "Atomic slot allocation using database-level constraints"
  
  components:
    database_constraint:
      type: "partial_unique_index"
      fields: ["time_slot_id", "appointment_date", "slot_sequence"]
      condition: "status IN ('PENDING', 'CONFIRMED', 'COMPLETED')"
      purpose: "Prevent double-booking at database level"
    
    slot_sequence_management:
      source: "time_slot.current_sequence"
      increment_strategy: "Atomic increment on successful booking"
      reset_policy: "Manual or scheduled reset"
    
    rate_limiting:
      layer_1: "Redis-based per-user rate limiting"
      limit: "1 request per second per user per time slot"
      window: "1 second"
      layer_2: "Redis soft limit pre-check"
      purpose: "Reduce database load"
    
    conflict_resolution:
      detection: "Database unique constraint violation"
      response: "HTTP 409 Conflict with specific error message"
      retry_suggestion: "Client should fetch updated available slots"
  
  performance_targets:
    p95_response_time: "< 500ms"
    concurrent_users: "100+"
    bookings_per_second: "1000+ (with optimizations)"

# ============================================
# 5. Security Contract
# ============================================

security:
  authentication:
    method: "JWT + Passport.js"
    token_type: "Bearer"
    access_token_lifetime: "15 minutes"
    refresh_token_lifetime: "7 days"
    refresh_token_storage: "Request body (refresh_token field) + UserSession database table"
    refresh_token_rotation: true
    refresh_token_endpoint: "POST /v1/auth/refresh"
    
  authorization:
    method: "RBAC (Role-Based Access Control)"
    roles:
      CUSTOMER:
        permissions: ["view_own_profile", "create_appointment", "view_own_appointments", "cancel_own_appointment"]
      ADMIN:
        permissions: ["manage_users", "manage_services", "manage_time_slots", "view_all_appointments", "manage_appointments"]
        note: "ADMIN 通过 /admin/appointments 管理预约，不继承 CUSTOMER 的 customer 端点权限。ADMIN/SUPER_ADMIN 可修改个人资料（update_profile）。"
      SUPER_ADMIN:
        permissions: ["all_admin_permissions", "system_settings", "view_audit_logs", "manage_admins"]
    
    implementation: "NestJS Guards + Custom Decorators (@Public(), @Roles())"
  
  data_protection:
    password_hashing: "bcrypt with salt rounds 12"
    sensitive_fields: ["password_hash", "refresh_token"]
    encryption_at_rest: "Database field-level encryption for sensitive data"
    
  http_security:
    headers:
      helmet: true
      cors:
        origin: "configured origins"
        credentials: true
      csp: "strict policy"
      hsts: true
      x_frame_options: "DENY"
      x_content_type_options: "nosniff"
      x_xss_protection: "1; mode=block"
    
    csrf_protection: true
    rate_limiting: true
  
  audit_logging:
    enabled: true
    events: ["login", "logout", "booking_creation", "booking_cancellation", "admin_actions"]
    storage: "Database + Winston structured logs"
    retention: "90 days"

# ============================================
# 6. Testing Contract
# ============================================

testing:
  deprecated: true
  replaced_by: x-coverage-matrix
  strategy: "TDD (Test-Driven Development) with RED/GREEN/REFACTOR cycles"
  
  layers:
    unit_tests:
      frontend: "Jest + Angular Testing Library"
      backend: "Jest + NestJS testing utilities"
      coverage_target: "≥70%"
    
    integration_tests:
      frontend: "Angular TestBed with mocked services"
      backend: "Supertest + Testcontainers (PostgreSQL, Redis)"
      coverage_target: "≥80%"
    
    e2e_tests:
      tool: "Playwright"
      scenarios:
        - "User registration and login"
        - "Service browsing and booking"
        - "Booking management"
        - "Admin user management"
      coverage_target: "≥90% business process coverage"
    
    performance_tests:
      tool: "k6"
      targets:
        - "API response time P95 < 500ms"
        - "Concurrent user simulation"
        - "High-concurrency booking scenario"
    
    security_tests:
      tools: ["npm audit", "OWASP ZAP", "dependency vulnerability scanning"]
      frequency: "Pre-commit and CI pipeline"
  
  tdd_enforcement:
    rule: "No business code without failing test first"
    process: "RED (write failing test) → GREEN (minimal code) → REFACTOR (improve)"
    gate: "All tests must pass before code review"

# ============================================
# 6a. Test Mock Policy (ARB-002)
# ============================================

x-test-mock-policy:
  description: "Three-tier mock governance enforced by ESLint mock-audit plugin"
  version: "2.1.0"
  enforcement: "compliance_gate_complete + ESLint MCP tool"
  
  rules:
    no-tier1-mock:
      cat: "1.1"
      level: "error"
      description: "Forbid jest.spyOn/jest.mock on TIER1 services (PrismaService, RedisService, ConfigService)"
    no-skipped-tests:
      cat: "1.2"
      level: "error"
      description: "Forbid skipped tests (describe.skip, it.skip, xdescribe, xit)"
    no-skipped-audit:
      cat: "1.0"
      level: "error"
      description: "eslint-disable bypass of TIER1 mock audit must reference a valid @Arbiter waiver ID"
    no-console-log:
      cat: "2.1"
      level: "error"
      description: "Forbid console.log/error/warn in production code"
    tier3-verify:
      cat: "3.1"
      level: "warn"
      description: "TIER3 mocks must verify call parameters with toHaveBeenCalledWith"
    no-uncovered-switch:
      cat: "3.2"
      level: "warn"
      description: "Switch statements should have a default branch"
  
  tier_definition:
    tier1_real_only:
      services:
        - PrismaService
        - RedisService
        - ConfigService
      mock_policy: "forbidden"
      error_level: "error"
      es_lint_rule: "booking/no-tier1-mock"
    tier2_fake_ok:
      services:
        - JwtService
        - QueueService
        - NotificationGateway
        - RateLimiterService
      mock_policy: "warn"
      error_level: "warn"
    tier3_boundary_mock:
      services:
        - EmailService
        - SMSService
      mock_policy: "require_param_verification"
      error_level: "warn"
      es_lint_rule: "booking/tier3-verify"

  integration_test_requirement:
    mode: "per_module"
    modules:
      - appointments
      - auth
      - cache
      - email
      - health
      - notifications
      - rate-limiter
      - services
      - stats
      - time-slots
      - users
      - verification

  waive_policy:
    requires_arbiter: true
    requires_tech_debt_registry: true
    max_validity_hours: 720  # 30 days
    bypass_detection_rule: "booking/no-skipped-audit"

# ============================================
# 6b. Test Contract (ARB-002)
# ============================================

x-test-contract:
  description: "Test framework configuration and lifecycle requirements"
  framework:
    backend:
      unit: "Jest + NestJS testing utilities"
      integration: "Supertest + Testcontainers (PostgreSQL 16, Redis 7.x)"
      mutation: "Stryker"
    frontend:
      unit: "Jest + Angular Testing Library"
      component: "Angular TestBed"
    e2e:
      tool: "Playwright"

  lifecycle:
    RED:
      action: "Write failing test before any business code"
      commit_tag: "[Red] {task_id}"
    GREEN:
      action: "Write minimal code to pass"
      commit_tag: "[Green] {task_id}"
    REFACTOR:
      action: "Improve code quality while keeping all tests green"
      commit_tag: "[Refactor] {task_id}"

  evidence_requirements:
    - artifact: "test_report.json"
      field: "execution_evidence"
      description: "Must contain key summary or assertion results from test command output"
    - artifact: "HANDOVER.md"
      description: "Task handover summary with core changes, assumptions, pitfalls"
    - artifact: "TASK_LOG.md"
      description: "Working memory scratchpad recording modification plan and key decisions"

# ============================================
# 6c. Coverage Matrix (ARB-002)
# ============================================

x-coverage-matrix:
  description: "Per-priority coverage thresholds enforced at CI quality gates"
  priorities:
    P0:
      name: "Critical"
      description: "Core business logic, authentication, high-concurrency paths"
      coverage:
        lines: 90
        branches: 85
        functions: 90
        statements: 90
      modules:
        - "auth"
        - "appointments"
        - "users"

    P1:
      name: "High"
      description: "Secondary business logic, admin operations"
      coverage:
        lines: 80
        branches: 75
        functions: 80
        statements: 80
      modules:
        - "admin"
        - "services"
        - "time-slots"

    P2:
      name: "Medium"
      description: "Infrastructure, shared utilities, cross-cutting concerns"
      coverage:
        lines: 70
        branches: 65
        functions: 70
        statements: 70
      modules:
        - "cache"
        - "notifications"
        - "email"
        - "rate-limiter"

    P3:
      name: "Low"
      description: "Configuration, health checks, non-critical paths"
      coverage:
        lines: 50
        branches: 40
        functions: 50
        statements: 50
      modules:
        - "health"
        - "config"

# ============================================
# 7. Deployment Contract
# ============================================

deployment:
  environments:
    development:
      docker_compose: "docker-compose.dev.yml"
      database: "PostgreSQL container"
      cache: "Redis container"
      auto_migration: true
      hot_reload: true
    
    production:
      docker_compose: "docker-compose.prod.yml"
      database: "PostgreSQL with persistence volume"
      cache: "Redis with persistence"
      migration_strategy: "separate migration container"
      health_checks: true
  
  container_specifications:
    backend:
      base_image: "node:22-alpine"
      port: 3001
      health_check: "GET /v1/health"
      environment_variables:
        required: ["DATABASE_URL", "REDIS_URL", "JWT_SECRET"]
        optional: ["LOG_LEVEL", "PORT", "CORS_ORIGIN"]
    
    frontend:
      base_image: "nginx:alpine"
      port: 80
      build_context: "booking-frontend/"
      environment_variables:
        required: ["API_BASE_URL"]
    
    migration:
      base_image: "node:22-alpine"
      command: "npx prisma migrate deploy"
      depends_on: ["postgres"]
  
  ci_cd_pipeline:
    platform: "GitHub Actions"
    workflows:
      - name: "Test and Build"
        triggers: ["push", "pull_request"]
        steps: ["install", "lint", "test", "build", "docker_build"]
      
      - name: "Deploy to Production"
        triggers: ["push to main"]
        steps: ["build", "test", "migration", "deploy", "smoke_test"]
    
    quality_gates:
      - "All tests pass"
      - "Code coverage meets targets"
      - "No security vulnerabilities"
      - "Build successful"
      - "Docker images built successfully"

# ============================================
# 8. Monitoring and Observability Contract
# ============================================

monitoring:
  health_checks:
    endpoint: "/v1/health"
    components: ["database", "redis", "memory", "disk"]
    frequency: "30 seconds"
  
  metrics:
    business_metrics:
      - "bookings.created.count"
      - "bookings.cancelled.count"
      - "users.active.count"
      - "services.available.count"
    
    performance_metrics:
      - "api.response.time.p95"
      - "database.query.duration"
      - "redis.command.duration"
      - "memory.usage.percent"
    
    error_metrics:
      - "errors.http.4xx.count"
      - "errors.http.5xx.count"
      - "errors.database.count"
      - "errors.redis.count"
  
  logging:
    format: "structured JSON"
    levels: ["error", "warn", "info", "debug"]
    transports: ["console", "file", "remote (optional)"]
    fields: ["timestamp", "level", "message", "context", "userId", "requestId"]
  
  alerting:
    conditions:
      - "api.p95_response_time > 1000ms for 5 minutes"
      - "database.connection.errors > 10 in 1 minute"
      - "memory.usage > 90% for 5 minutes"
      - "http.errors.5xx > 1% of requests for 5 minutes"

# ============================================
# 9. Compliance and Constraints
# ============================================

compliance:
  
  # TDD enforcement
  tdd_required: true
  test_first_principle: "No business code without failing test"
  
  # Architecture constraints
  stateless_services: true
  distributed_lock_required: true
  no_local_state_storage: true
  
  # Security constraints
  https_required: true
  sensitive_data_encryption: true
  audit_logging_required: true
  
  # Deployment constraints
  immutable_tags: true
  health_checks_required: true
  rollback_capability: true
  
  # Code quality constraints
  type_safety_required: true
  linting_required: true
  code_review_required: true

# ============================================
# 10. API 字段命名与映射规范
# ============================================

api_field_mapping:
  naming_convention:
    description: >
      合约中 API 参数命名分为两套体系：
      1. 旧有业务端点（appointments, services, time-slots）| wire_format: snake_case
      2. 认证端点（/auth/*）                          | wire_format: camelCase
    backend_dto:
      default: "camelCase"
      note: "NestJS DTO 类统一使用 camelCase，旧端点通过拦截器或手动映射实现 snake_case 转换"
    wire_formats:
      - segment: "/auth/*"
        format: "camelCase"
        reason: "PII 加密合约采用方案 C v4，auth DTO 直接使用 camelCase 避免映射混淆"
      - segment: "default"
        format: "snake_case"
        reason: "与数据库 Prisma schema 对齐，前端通过 api-transform.interceptor 自动转换"
  
  # 核心字段映射表
  field_mappings:
    - wire_field: "user_id"
      frontend_field: "userId"
      db_field: "user_id"
    - wire_field: "time_slot_id"
      frontend_field: "timeSlotId"
      db_field: "time_slot_id"
    - wire_field: "service_id"
      frontend_field: "serviceId"
      db_field: "service_id"
    - wire_field: "appointment_date"
      frontend_field: "appointmentDate"
      db_field: "appointment_date"
    - wire_field: "slot_sequence"
      frontend_field: "slotSequence"
      db_field: "slot_sequence"
    - wire_field: "appointment_number"
      frontend_field: "appointmentNumber"
      db_field: "appointment_number"
    - wire_field: "customer_info"
      frontend_field: "customerInfo"
      db_field: "customer_info"
    - wire_field: "created_at"
      frontend_field: "createdAt"
      db_field: "created_at"
    - wire_field: "updated_at"
      frontend_field: "updatedAt"
      db_field: "updated_at"
    - wire_field: "notes"
      frontend_field: "notes"
      db_field: "remarks"
      note: "前端和API使用notes，数据库实际字段为remarks"
    - wire_field: "preferred_sequence"
      frontend_field: "preferredSequence"
      db_field: "preferred_sequence"
    - wire_field: "active"
      frontend_field: "active"
      db_field: "isActive"
      note: "Contract 使用 active，Prisma schema 使用 isActive"
    - wire_field: "service_active"
      frontend_field: "serviceActive"
      db_field: "service.isActive"
      note: "AdminAppointmentDto 专用 — 标记关联服务是否激活。来源: Appointment.service.isActive"
    - wire_field: "category"
      frontend_field: "category"
      db_field: "categoryId"
      note: "API 使用 category 字符串，数据库通过 categoryId 关联 ServiceCategory"
    - wire_field: "price_per_minute"
      frontend_field: "pricePerMinute"
      db_field: "price_per_minute"
    - wire_field: "tax_rate"
      frontend_field: "taxRate"
      db_field: "tax_rate"
      note: >
        ⚠️ WIRE vs DB FORMAT: API wire format is PERCENTAGE (e.g. 8 = 8%).
        DB stores as DECIMAL FRACTION (e.g. 0.08). Mapper converts: ÷100 on
        input (API→DB), ×100 on output (DB→API). Frontend always sends/receives
        percentage. The `tax_included_amount` formula in the DB layer uses the
        DB-stored decimal fraction: price × (1 + tax_rate_db).
        DB column: Decimal(5,4) — range 0.0000 to 9.9999.
    - wire_field: "duration_minutes"
      frontend_field: "durationMinutes"
      db_field: "duration_minutes"
    - wire_field: "price"
      frontend_field: "price"
      db_field: "price"
    - wire_field: "tax_included_amount"
      frontend_field: "taxIncludedAmount"
      db_field: "tax_included_amount"
    - wire_field: "overtime_minutes"
      frontend_field: "overtimeMinutes"
      db_field: "overtime_minutes"
    - wire_field: "role"
      frontend_field: "role"
      db_field: "role"
      note: "字段名已统一为role"
   
   # PII 字段（禁止暴露给前端）
  pii_fields_excluded:
    - "emailHash"
    - "phoneHash"
    - "emailEncrypted"
    - "phoneEncrypted"
    - "passwordHash"
  
  # 前端拦截器自动转换
  transformation_strategy: >
    前端 HttpInterceptor 负责在请求时自动将 camelCase 转换为 snake_case，
    在响应时自动将 snake_case 转换为 camelCase。
    所有前端 DTO 类型定义使用 camelCase。

# ============================================
# 11. Change Management
# ============================================

change_management:
  
  contract_versioning:
    strategy: "Semantic versioning (MAJOR.MINOR.PATCH)"
    breaking_changes: "Require MAJOR version increment"
    backward_compatibility: "At least one previous version supported"
  
  api_deprecation:
    notice_period: "6 months"
    migration_guide_required: true
  
  database_migrations:
    tool: "Prisma Migrate"
    reversible: true
    backup_required: true
    testing_required: true
  
  deployment_process:
    approval_required: true
    staging_environment: true
    rollback_plan_required: true
    post_deployment_validation: true

# ============================================
# 12. WebSocket Events
# ============================================

websocket_events:
  description: "Real-time events pushed from server to connected clients via WebSocket"
  connection:
    endpoint: "wss://api.example.com/notifications"
    authentication: "JWT Bearer Token (via connection handshake)"
    heartbeat: "30 seconds"

  events:
    appointment_status_changed:
      event: "appointment.status_changed"
      direction: "Server → Client"
      description: "当预约状态发生变更时推送（管理员手动确认、取消、完成等），触发 dashboard 自动刷新统计卡片和预约列表"
      payload:
        type: "object"
        properties:
          appointmentId:
            type: "string"
            description: "预约 ID"
          status:
            type: "string"
            enum: ["PENDING", "CONFIRMED", "CANCELLED", "COMPLETED", "EXPIRED"]
            description: "新状态"
          previousStatus:
            type: "string"
            enum: ["PENDING", "CONFIRMED", "CANCELLED", "COMPLETED", "EXPIRED"]
            description: "变更前状态"
          timestamp:
            type: "string"
            format: "date-time"
            description: "状态变更时间 (ISO 8601)"
      example:
        event: "appointment.status_changed"
        data:
          appointmentId: "apt_1234567890abcdef"
          status: "CONFIRMED"
          previousStatus: "PENDING"
          timestamp: "2026-05-08T10:30:00.000Z"

    slot_booked:
      event: "slot.booked"
      direction: "Server → Client"
      description: "当时间段被其他用户预订时推送，实时更新前端槽位可用性"
      payload:
        type: "object"
        properties:
          timeSlotId:
            type: "string"
            description: "被预订的时间段ID"
          appointmentDate:
            type: "string"
            format: "date-time"
            description: "预约日期"
          remainingCapacity:
            type: "integer"
            description: "该时间段剩余容量"

    system_health_updated:
      event: "system.health.updated"
      direction: "Server → Client"
      description: "系统健康状态变更时推送，触发 Dashboard 系统状态卡片自动刷新"
      payload:
        type: "object"
        properties:
          server:
            type: "string"
            description: "Server status indicator (Online/Degraded/Offline)"
          database:
            type: "string"
            description: "Database status indicator (Online/Degraded/Offline)"
          api:
            type: "string"
            description: "API status indicator (Online/Degraded/Offline)"
          redis:
            type: "string"
            description: "Redis status indicator (Online/Degraded/Offline)"
          lastBackup:
            type: "string"
            format: "date-time"
            description: "Timestamp of last database backup (ISO 8601)"
          uptime:
            type: "string"
            description: "Uptime percentage display string (e.g. '99.9%' )"

    notification_new:
      event: "notification.new"
      direction: "Server → Client"
      description: "新的系统通知推送给管理员，触发通知铃铛刷新和未读数更新"
      payload:
        type: "object"
        properties:
          id:
            type: "string"
            description: "通知ID"
          type:
            type: "string"
            enum: ["info", "warning", "error", "success"]
            description: "通知类型"
          title:
            type: "string"
            description: "通知标题"
          body:
            type: "string"
            description: "通知正文"
          createdAt:
            type: "string"
            format: "date-time"
            description: "通知创建时间 (ISO 8601)"

    stats_updated:
      event: "stats.updated"
      direction: "Server → Client"
      description: "Dashboard 统计数据更新时推送，触发统计卡片自动刷新"
      payload:
        type: "object"
        properties:
          totalBookings:
            type: "integer"
            description: "总预约数"
          todayBookings:
            type: "integer"
            description: "今日预约数"
          pendingBookings:
            type: "integer"
            description: "待确认预约数"
          activeUsers:
            type: "integer"
            description: "活跃用户数"
          totalRevenue:
            type: "number"
            description: "总收入"

    # ---- Extra events (implemented but not in original v1.7 scope) ----

    appointment_updated:
      event: "appointment_updated"
      direction: "Server → Client"
      description: "预约信息被修改时推送给特定用户（发往 user:<userId> room）"
      channel: "user:<userId>"
      payload:
        type: "object"
        properties:
          appointmentId:
            type: "string"
            description: "预约 ID"
          changes:
            type: "object"
            description: "变更的字段和值"
          timestamp:
            type: "string"
            format: "date-time"
            description: "更新时间 (ISO 8601)"

    booking_confirmed:
      event: "booking_confirmed"
      direction: "Server → Client"
      description: "预约确认成功时推送给特定用户（发往 user:<userId> room）"
      channel: "user:<userId>"
      payload:
        type: "object"
        properties:
          appointmentId:
            type: "string"
            description: "预约 ID"
          appointmentNumber:
            type: "string"
            description: "预约编号"
          timestamp:
            type: "string"
            format: "date-time"

    booking_cancelled:
      event: "booking_cancelled"
      direction: "Server → Client"
      description: "预约取消时推送给特定用户（发往 user:<userId> room）"
      channel: "user:<userId>"
      payload:
        type: "object"
        properties:
          appointmentId:
            type: "string"
            description: "预约 ID"
          reason:
            type: "string"
            description: "取消原因"
          timestamp:
            type: "string"
            format: "date-time"

     slot_update:
       event: "slot-update"
       direction: "Server → Client"
       description: "时间段可用性变更时推送（前端 time-slot-picker 监听此事件实时更新 UI）"
       payload:
         type: "object"
         properties:
           slotId:
             type: "string"
             description: "时间段 ID"
           isActive:
             type: "boolean"
             description: "时间段是否仍可用"
           bookedBy:
             type: "string"
             description: "预订者（如果有）"
           timestamp:
             type: "string"
             format: "date-time"
             description: "变更时间 (ISO 8601)"

     service_disabled:
       event: "service.disabled"
       direction: "Server → Client"
       description: "管理员禁用服务时推送（v1.8.0 新增）。触发前端刷新服务列表和预约列表，并更新关联预约的 '⚠️ Inactive' 标记。"
       payload:
         type: "object"
         properties:
           serviceId:
             type: "string"
             description: "被禁用的服务 ID"
           serviceName:
             type: "string"
             description: "被禁用的服务名称"
           cancelledCount:
             type: "integer"
             description: "级联取消的 PENDING 预约数量"
           timestamp:
             type: "string"
             format: "date-time"
             description: "变更时间 (ISO 8601)"

# ============================================
# End of Contract
# ============================================

# ============================================================
# 11. PII 加密契约扩展 (方案 C v4, TASK-D1)
# ============================================================

pii_encryption_contract:
  version: "1.0.0-draft"
  generated_by: "@Architect (TASK-D1)"
  generated_date: "2026-04-21"
  design_doc: ".opencode/context/requirements/piiEncryptionStrategy.md"

  # User 三字段 PII 加密模型
  user_pii_model:
    description: >
      每个 PII 字段（phone/email）拆分为三个物理列：
      明文脱敏展示列、SHA-256 哈希唯一索引列、AES-256-GCM 加密密文列。
    phone_fields:
      - name: phone
        type: "string (nullable)"
        content: "脱敏掩码字符串（如 138****5678）"
        exposure: "前端展示允许"
        unique: false
      - name: phoneHash
        type: "string (nullable)"
        content: "SHA-256(phone_plaintext + PII_HASH_PEPPER)"
        exposure: "禁止暴露给前端"
        unique: true
        index: "@unique"
      - name: phoneEncrypted
        type: "string (nullable)"
        content: "AES-256-GCM 密文（格式：iv:authTag:ciphertext，Base64）"
        exposure: "禁止暴露给前端"
        unique: false
    email_fields:
      - name: email
        type: "string (nullable)"
        content: "脱敏掩码字符串（如 us***@example.com）"
        exposure: "前端展示允许"
        unique: false
      - name: emailHash
        type: "string (nullable)"
        content: "SHA-256(email_plaintext + PII_HASH_PEPPER)"
        exposure: "禁止暴露给前端"
        unique: true
        index: "@unique"
      - name: emailEncrypted
        type: "string (nullable)"
        content: "AES-256-GCM 密文（格式：iv:authTag:ciphertext，Base64）"
        exposure: "禁止暴露给前端"
        unique: false
    password_field:
      name: passwordHash
      type: "string (nullable)"
      content: "bcrypt 哈希（rounds=12，OWASP 2023）"
      exposure: "禁止暴露给前端"

  # JWT Payload 约束（移除 email，符合 NIST SP 800-63B）
  jwt_payload_contract:
    access_token:
      required_fields: [sub, roles, permissions, iat, exp, jti]
      forbidden_fields: [email, phone]
      note: "JWT 仅签名非加密，禁止在 Payload 中携带任何 PII 字段"
    refresh_token:
      required_fields: [sub, tokenFamily, iat, exp]
      forbidden_fields: [email, phone]

  # Auth 端点契约（方案 C v4 专用）
  auth_endpoints:
    register_send_code:
      method: POST
      path: "/v1/auth/register/send-code"
      auth_required: false
      rate_limit: "5次/分钟/contact"
      request_body:
        contact: "string (手机号或邮箱原文)"
        contactType: "enum: phone | email"
      success_response:
        status: 200
        body:
          statusCode: 200
          message: "验证码已发送，请在 5 分钟内完成验证"
          data:
            maskedContact: "string"
            expiresIn: 300
          timestamp: "ISO 8601"
          requestId: "req-{uuid-v4}"
      error_responses:
        409: "手机号/邮箱已注册"
        429: "超出限流"

    register_complete:
      method: POST
      path: "/v1/auth/register/complete"
      auth_required: false
      rate_limit: "10次/分钟/IP"
      note: "⚠️ 此端点必须在 /auth/register/send-code 成功之后调用。缺少前置验证码流程的请求将被拒绝。注册仅支持验证码验证方式，不支持直接创建用户。"
      request_body:
        contact: "string"
        contactType: "enum: phone | email"
        code: "string (6位数字)"
        password: "string (minLength=8)"
        name: "string"
      success_response:
        status: 201
        body:
          statusCode: 201
          message: "注册成功"
          data:
            accessToken: "string"
            refreshToken: "string"
            expiresIn: 900
            tokenType: "Bearer"
          timestamp: "ISO 8601"
          requestId: "req-{uuid-v4}"
      error_responses:
        400: "验证码无效或已过期"
        409: "手机号/邮箱已注册（并发）"

    login_send_code:
      method: POST
      path: "/v1/auth/login/send-code"
      auth_required: false
      rate_limit: "5次/分钟/contact"
      request_body:
        contact: "string"
        contactType: "enum: phone | email"
      success_response:
        status: 200
        body:
          statusCode: 200
          message: "验证码已发送"
          data:
            expiresIn: 300
          timestamp: "ISO 8601"
          requestId: "req-{uuid-v4}"
      note: "为防止用户枚举，用户不存在时也返回 200"

    login_verify_code:
      method: POST
      path: "/v1/auth/login/verify-code"
      auth_required: false
      rate_limit: "10次/分钟/contact"
      request_body:
        contact: "string"
        contactType: "enum: phone | email"
        code: "string (6位数字)"
      success_response:
        status: 200
        body:
          statusCode: 200
          message: "登录成功"
          data:
            accessToken: "string"
            refreshToken: "string"
            expiresIn: 900
            tokenType: "Bearer"
          timestamp: "ISO 8601"
          requestId: "req-{uuid-v4}"
      error_responses:
        401: "验证码无效或已过期"
        404: "用户不存在"

    login_password:
      method: POST
      path: "/v1/auth/login/password"
      auth_required: false
      rate_limit: "5次/分钟/contact"
      request_body:
        contact: "string"
        contactType: "enum: phone | email"
        password: "string (minLength=8)"
      success_response:
        status: 200
        body:
          statusCode: 200
          message: "登录成功"
          data:
            accessToken: "string"
            refreshToken: "string"
            expiresIn: 900
            tokenType: "Bearer"
          timestamp: "ISO 8601"
          requestId: "req-{uuid-v4}"
      error_responses:
        401: "凭证无效"
        429: "超出限流"

    # [TASK-D5 修复] 补充 refresh 和 logout，确保 pii_encryption_contract 自包含
    refresh:
      method: POST
      path: "/v1/auth/refresh"
      auth_required: false
      rate_limit: "10次/分钟/IP"
      request_body:
        refreshToken: "string"
      success_response:
        status: 200
        body:
          statusCode: 200
          message: "Token 已刷新"
          data:
            accessToken: "string"
            refreshToken: "string"
            expiresIn: 900
            tokenType: "Bearer"
          timestamp: "ISO 8601"
          requestId: "req-{uuid-v4}"
      error_responses:
        401: "Refresh Token 无效或已过期"
      note: "实现 Token 旋转（Rotation）：每次刷新废弃旧 Refresh Token，签发新的"
      deviation: "实际实现使用 HttpOnly cookie（res.cookie('refreshToken', ...)）接收 Refresh Token，而非契约定义的请求体字段。此为安全性增强（防 XSS 窃取 token），但移动端客户端需确保支持 cookie。见 §5 security.authentication.refresh_token_storage。"

    reset_password_send_code:
      method: POST
      path: "/v1/auth/reset-password/send-code"
      auth_required: false
      rate_limit: "5次/分钟/contact"
      request_body:
        contact: "string (手机号或邮箱原文)"
        contactType: "enum: phone | email"
      success_response:
        status: 200
        body:
          statusCode: 200
          message: "重置密码验证码已发送，请在 5 分钟内完成验证"
          data:
            expiresIn: 300
          timestamp: "ISO 8601"
          requestId: "req-{uuid-v4}"
      error_responses:
        429: "超出限流"
      note: "为防止用户枚举，用户不存在时也返回 200（与 login_send_code 一致）"

    reset_password_verify:
      method: POST
      path: "/v1/auth/reset-password/verify"
      auth_required: false
      rate_limit: "10次/分钟/contact"
      request_body:
        contact: "string"
        contactType: "enum: phone | email"
        code: "string (6位数字)"
        newPassword: "string (minLength=8)"
      success_response:
        status: 200
        body:
          statusCode: 200
          message: "密码重置成功"
          data:
            message: "密码已更新，请使用新密码登录"
