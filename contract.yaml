        response:
          success:
            status: 200
            body:
              type: "object"
              properties:
                locale: { type: "string", description: "当前语言代码" }
                updatedAt: { type: "string", format: "date-time", description: "字典最后更新时间" }
                translations:
                  type: "object"
                  description: "嵌套翻译对象，key 为 domain，value 为 { key: value } 映射"

      admin:
        list:
