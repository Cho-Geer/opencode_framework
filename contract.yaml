          authorization: ["ADMIN", "SUPER_ADMIN"]
          rate_limit: "60次/分钟/IP"
          query_parameters:
            page: { type: "integer", default: 1 }
            limit: { type: "integer", default: 10 }
            search: { type: "string", description: "搜索用户名、邮箱或手机号" }
            role: { type: "string", enum: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"] }
            status: { type: "string", enum: ["ACTIVE", "INACTIVE", "BLOCKED"] }
          response:
            success:
              status: 200
              body:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id: { type: "string" }
                        name: { type: "string" }
                        email: { type: "string", description: "脱敏展示" }
                        phone: { type: "string", description: "脱敏展示" }
                        role: { type: "string" }
                        status: { type: "string" }
                      created_at: { type: "string", format: "date-time" }
                  total: { type: "integer" }
                  page: { type: "integer" }
                  limit: { type: "integer" }
        
        create:
          method: "POST"
          path: "/v1/admin/users"
