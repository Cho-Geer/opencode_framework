# ============================================
# 1. Project Information
# ============================================

project:
  name: "Booking System Angular+NestJS Refactor"
  version: "1.0.0"
  description: "Modern appointment booking system with high-concurrency handling"
  repository: "booking_system_refactor"
  
  technology_stack:
    frontend:
      framework: "Angular v21+"
      ui_library: "PrimeNG + Tailwind CSS v4"
      state_management: "NgRx Signals (@ngrx/signals)"
      testing: "Jest + Angular Testing Library"
      e2e_testing: "Playwright"
    
    backend:
      framework: "NestJS v11+"
      runtime: "Node.js 22.x LTS"
      orm: "Prisma 7.6.0+"
      authentication: "JWT + Passport"
      security: "helmet, CORS, CSRF protection"
      testing: "Jest + Supertest + Testcontainers"
    
    database:
      primary: "PostgreSQL 16"
      cache: "Redis 7.x"
      queue: "BullMQ (Redis backend)"
    
    deployment:
      container_runtime: "Docker 24.x"
      orchestration: "Docker Compose v2"
      ci_cd: "GitHub Actions"
      registry: "Docker Hub"

# ============================================
# 2. API Contract
# ============================================

api:
  base_path: "/v1"
  versioning_strategy: "URI path versioning"
  default_content_type: "application/json"
  
  authentication:
    type: "JWT Bearer Token"
    token_lifetime: "15 minutes"
    refresh_token_lifetime: "7 days"
    endpoints:
      # [方案 C v4 TASK-D5 修复] 旧单步端点已废弃，替换为分步端点
      login_password: "POST /v1/auth/login/password"           # 密码登录
      login_send_code: "POST /v1/auth/login/send-code"         # 验证码登录第一步
      login_verify_code: "POST /v1/auth/login/verify-code"     # 验证码登录第二步
      register_send_code: "POST /v1/auth/register/send-code"   # 注册第一步
      register_complete: "POST /v1/auth/register/complete"     # 注册第二步
      reset_password_send_code: "POST /v1/auth/reset-password/send-code"  # 忘记密码第一步
      reset_password_verify: "POST /v1/auth/reset-password/verify"        # 忘记密码第二步
      refresh: "POST /v1/auth/refresh"
      logout: "POST /v1/auth/logout"
      # deprecated (勿用，已被上方分步端点替代)
      login_legacy_DEPRECATED: "POST /v1/auth/login"
      register_legacy_DEPRECATED: "POST /v1/auth/register"

  # -------------------------------------------------------
  # Global Request Headers
  # -------------------------------------------------------
  # Headers that MAY be included in any API request. When present,
  # they override server-side defaults for the duration of the request.
  # -------------------------------------------------------
  global_request_headers:
    X-Timezone:
      type: "string"
      required: false
      format: "IANA timezone (e.g. Asia/Shanghai, America/New_York)"
      description: "客户端时区标识。后端据此解释日期参数、返回带偏移的时间戳、以及执行营业时间相关的业务逻辑。来源: Tier1 Browser Intl → Tier2 User.preferredTimezone → Tier3 DEFAULT_TIMEZONE env."
      example: "Asia/Shanghai"
      since: "v1.7.5"

  # -------------------------------------------------------
  # Global Response Envelope
  # -------------------------------------------------------
  # Every successful API response passes through the backend
  # ResponseInterceptor, which wraps business payloads in a
  # uniform envelope. The per-endpoint response schemas below
  # describe only the inner `data` payload; the envelope is
  # implicit for all endpoints unless otherwise noted.
  #
  # Timezone note: when X-Timezone header is present in the request,
  # the timestamp field uses the client's timezone offset
  # (e.g. 2026-05-12T14:00:00.000+08:00). When absent, UTC (Z) is used.
  # -------------------------------------------------------
  response_envelope:
    description: "Uniform response envelope (ResponseInterceptor)"
    format:
      statusCode: "integer — HTTP status code (e.g. 200)"
      message: "string — human-readable status message"
      data: "<T> — business payload (see per-endpoint body for type)"
      timestamp: "string — ISO 8601 with timezone (UTC Z or ±HH:MM offset, per X-Timezone header)"
      requestId: "string — UUID v4 with 'req-' prefix for tracing"
    paginated_format:
      description: "List endpoints wrap items inside data.items with meta"
      data:
        items: "T[] — paginated result items"
        meta: "{ total, page, limit, totalPages, hasNext, hasPrev }"
    error_format:
      statusCode: "integer — HTTP error status code"
      message: "string — error description"
      error: "string — error type (e.g. Bad Request)"
      errors: "[{ field, message, code }] — optional validation details"
      timestamp: "string — ISO 8601 with timezone (UTC Z or ±HH:MM offset)"
      requestId: "string — UUID v4 with 'req-' prefix"

  endpoints:
    
    # Auth endpoints
    # [方案 C v4 TASK-D5 修复] 以下旧端点已废弃，请使用 pii_encryption_contract.auth_endpoints 中的分步端点
    auth:
      # ⚠️ DEPRECATED: 不再使用，由 /auth/login/password 和 /auth/login/send-code + verify-code 替代
      login_DEPRECATED:
        deprecated: true
        replacement: "POST /v1/auth/login/password (密码登录) 或 POST /v1/auth/login/send-code + /verify-code (验证码登录)"
        method: "POST"
        path: "/auth/login"
        request:
          body:
            type: "object"
            properties:
              email:
                type: "string"
                format: "email"
                required: true
              password:
                type: "string"
                minLength: 8
                required: true
        response:
          success:
            status: 200
            body:
              type: "object"
              properties:
                access_token: { type: "string" }
                refresh_token: { type: "string" }
                user:
                  type: "object"
                  properties:
                    id: { type: "string" }
                    email: { type: "string" }
                    name: { type: "string" }
                    role: { type: "string", enum: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"] }
          error:
            status: 401
            body:
              type: "object"
              properties:
                error: { type: "string", example: "Invalid credentials" }
      
      # ⚠️ DEPRECATED: 不再使用，由 /auth/register/send-code + /register/complete 替代
      register_DEPRECATED:
        deprecated: true
        replacement: "POST /v1/auth/register/send-code (第一步) + POST /v1/auth/register/complete (第二步)"
        method: "POST"
        path: "/auth/register"
        request:
          body:
            type: "object"
            properties:
              email:
                type: "string"
                format: "email"
                required: true
              password:
                type: "string"
                minLength: 8
                required: true
              name:
                type: "string"
                required: true
        response:
          success:
            status: 201
            body:
              type: "object"
              properties:
                user:
                  type: "object"
                  properties:
                    id: { type: "string" }
                    email: { type: "string" }
                    name: { type: "string" }
                    role: { type: "string", enum: ["CUSTOMER"] }
          error:
            status: 400
            body:
              type: "object"
              properties:
                error: { type: "string", example: "User already exists" }
    
    # User endpoints
    users:
      get_profile:
        method: "GET"
        path: "/v1/users/profile"
        authentication: true
        authorization: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"]
        note: "所有已认证角色均可查看自身资料"
        response:
          success:
            status: 200
            body:
              type: "object"
              properties:
                id: { type: "string" }
                email: { type: "string", description: "脱敏展示，如 us***@example.com" }
                name: { type: "string" }
                phone: { type: "string", description: "脱敏展示，如 138****5678" }
                role: { type: "string", enum: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"] }
                status: { type: "string", enum: ["ACTIVE", "INACTIVE", "BLOCKED"] }
                preferredTimezone: { type: "string", description: "用户偏好时区（IANA 字符串，可空）" }
                created_at: { type: "string", format: "date-time" }

      update_profile:
        method: "PUT"
        path: "/v1/users/profile"
        authentication: true
        authorization: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"]
        request:
          body:
            type: "object"
            properties:
              name: { type: "string" }
        response:
          success:
            status: 200
            body:
              type: "object"
              properties:
                id: { type: "string" }
                email: { type: "string", description: "脱敏展示，如 us***@example.com" }
                name: { type: "string" }
                phone: { type: "string", description: "脱敏展示，如 138****5678" }
                role: { type: "string", enum: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"] }
                status: { type: "string", enum: ["ACTIVE", "INACTIVE", "BLOCKED"] }
                created_at: { type: "string", format: "date-time" }
                _message: { type: "string", example: "资料已更新" }

      update_timezone:
        method: "PATCH"
        path: "/v1/users/profile/timezone"
        authentication: true
        authorization: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"]
        note: "更新当前用户偏好时区。通常由前端在首次登录时自动调用（检测浏览器 Intl 时区并提交）"
        request:
          body:
            type: "object"
            properties:
              timezone:
                type: "string"
                required: true
                description: "IANA 时区字符串（如 Asia/Shanghai、America/New_York）"
                example: "Asia/Shanghai"
        response:
          success:
            status: 200
            body:
              type: "object"
              properties:
                message: { type: "string", example: "时区已更新" }
                preferredTimezone: { type: "string", example: "Asia/Shanghai" }
          error:
            status: 400
            body:
              type: "object"
              properties:
                error: { type: "string", example: "当前密码不正确" }

    # Appointment endpoints
    appointments:
      create:
        method: "POST"
        path: "/v1/appointments"
        authentication: true
        authorization: ["CUSTOMER"]
        high_concurrency: true
        request:
          headers:
            Idempotency-Key:
              type: "string"
              required: true
              description: "幂等键 — SHA-256(serviceId + slotId + userId + preferredSequence + timestamp)，防重复提交"
          body:
            type: "object"
            properties:
              time_slot_id: { type: "string", required: true }
              service_id: { type: "string", required: true, description: "服务ID，从服务选择页传递" }
              appointment_date: { type: "string", format: "date-time", required: true }
              preferred_sequence: { type: "integer", required: true, description: "前端生成的随机值(0-99)，用于高并发热点分片" }
              customer_info: { type: "object", description: "客户补充信息(JSON格式)" }
              notes: { type: "string", description: "备注信息(前端字段名notes，对应数据库remarks字段)" }
              overtime_minutes: { type: "integer", description: "超时时长(分钟). 后端验证不会与相邻时段的已有预约重叠; 若重叠返回 409 Conflict" }
        response:
          success:
            status: 201
            body:
              type: "object"
              properties:
                booking:
                  type: "object"
                  properties:
                    id: { type: "string" }
                    user_id: { type: "string" }
                    service_id: { type: "string" }
                    time_slot_id: { type: "string" }
                    appointment_date: { type: "string", format: "date-time" }
                    status: { type: "string", enum: ["PENDING", "CONFIRMED", "CANCELLED", "COMPLETED", "EXPIRED"] }
                    slot_sequence: { type: "integer" }
                    duration_minutes: { type: "integer" }
                    price: { type: "number", format: "decimal" }
                    tax_rate: { type: "number", format: "decimal", description: "税率百分比快照 (e.g. 8 = 8%). Wire format is percentage." }
                    tax_included_amount: { type: "number", format: "decimal" }
                    created_at: { type: "string", format: "date-time" }
          conflict:
            status: 409
            body:
              type: "object"
              properties:
                error: { type: "string", example: "Time slot is already booked" }
      
      list:
        method: "GET"
        path: "/v1/appointments"
        authentication: true
        authorization: ["CUSTOMER"]
        query_parameters:
          page: { type: "integer", required: false, default: 1, description: "Page number" }
          limit: { type: "integer", required: false, default: 20, description: "Items per page" }
          start_date: { type: "string", format: "date" }
          end_date: { type: "string", format: "date" }
          status: { type: "string", enum: ["PENDING", "CONFIRMED", "CANCELLED", "COMPLETED", "EXPIRED"] }
        response:
          success:
            status: 200
            body:
              type: "object"
              properties:
                data:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      id: { type: "string" }
                      time_slot_id: { type: "string" }
                      appointment_date: { type: "string", format: "date-time" }
                      status: { type: "string", enum: ["PENDING", "CONFIRMED", "CANCELLED", "COMPLETED", "EXPIRED"] }
                      service_name: { type: "string" }
                      time_slot_start: { type: "string", format: "date-time" }
                      time_slot_end: { type: "string", format: "date-time" }
                      duration_minutes: { type: "integer" }
                      price: { type: "number", format: "decimal" }
                      tax_rate: { type: "number", format: "decimal", description: "税率百分比快照 (e.g. 8 = 8%). Wire format is percentage." }
                      tax_included_amount: { type: "number", format: "decimal" }
                pagination:
                  type: "object"
                  properties:
                    page: { type: "integer" }
                    limit: { type: "integer" }
                    total: { type: "integer" }
                    total_pages: { type: "integer" }
    
      cancel:
        method: "POST"
        path: "/v1/appointments/:id/cancel"
        authentication: true
        authorization: ["CUSTOMER"]
        request:
          body: null
        response:
          success:
            status: 200
            body:
              type: "object"
              properties:
                message: { type: "string", example: "Appointment cancelled successfully" }
    
    # Service endpoints
    services:
      list:
        method: "GET"
        path: "/v1/services"
        authentication: false
        description: "公开端点 — 获取服务列表。未登录用户（访客）也可浏览服务"
        response:
          success:
            status: 200
            body:
              type: "array"
              items:
                type: "object"
                properties:
                  id: { type: "string" }
                  name: { type: "string" }
                  description: { type: "string" }
                  duration: { type: "integer", description: "Duration in minutes" }
                  price: { type: "number", format: "decimal" }
                  active: { type: "boolean" }
                  price_per_minute: { type: "number", format: "decimal" }
                  tax_rate: { type: "number", format: "decimal", description: "税率百分比 (e.g. 8 = 8%). Wire format is percentage." }
   
    # Time slot endpoints
    time_slots:
      available:
        method: "GET"
        path: "/v1/time-slots/available"
        authentication: false
        description: "公开端点 — 获取可用时间段。未登录用户（访客）也可查询可用时段"
        query_parameters:
          service_id: { type: "string", required: true }
          startDate: { type: "string", format: "date", required: true, description: "起始日期 (ISO 8601)。传入单一日期：startDate=2026-05-12&endDate=2026-05-12 查询单日可用时段" }
          endDate: { type: "string", format: "date", required: true, description: "结束日期 (ISO 8601)。与 startDate 配合定义可查询日期范围" }
          overtime_minutes: { type: "integer", required: false, description: "当提供时, 每个时槽返回 maxOvertimeMinutes 反映安全超时上限" }
          timezone: { type: "string", required: false, description: "IANA 时区字符串（如 Asia/Shanghai）。后端据此将营业时间配置转换到正确的时间边界。缺省时由 X-Timezone header → User.preferredTimezone → DEFAULT_TIMEZONE 解析" }
        response:
          success:
            status: 200
            body:
              type: "array"
              items:
                type: "object"
                properties:
                  id: { type: "string" }
                  start_time: { type: "string", format: "date-time" }
                  end_time: { type: "string", format: "date-time" }
                  capacity: { type: "integer" }
                  booked_count: { type: "integer" }
                  available: { type: "boolean" }
                  max_overtime_minutes: { type: "integer", description: "当前时槽允许的最大安全超时(分钟), 超过可能导致与相邻时段重叠" }
    
    # Admin endpoints (v1.3.0新增, v1.4.0扩展DASH-001~004)
    admin:
      stats:
        method: "GET"
        path: "/v1/admin/stats"
        authentication: true
        authorization: ["ADMIN", "SUPER_ADMIN"]
        rate_limit: "30次/分钟/IP"
        query_parameters:
          # x-frontend-driver: BookingDistributionPanelComponent "Time" button dropdown → timeRange change → loadStats(timeRange)
          timeRange: { type: "string", enum: ["last24h", "last7d", "last30d", "thisMonth", "lastMonth", "custom"], required: false, description: "时间范围筛选（由前端仪表盘 Booking Distribution Panel 的 Time 按钮下拉菜单驱动）" }
          startDate: { type: "string", format: "date", required: false, description: "自定义起始日期 (ISO 8601)" }
          endDate: { type: "string", format: "date", required: false, description: "自定义结束日期 (ISO 8601)" }
          timezone: { type: "string", required: false, description: "IANA 时区字符串（如 Asia/Shanghai）。后端据此计算日期边界（「今天」、「本月」等），确保聚合统计在正确的日历日内" }
        response:
          success:
            status: 200
            body:
              type: "object"
              properties:
                today_bookings:
                  type: "object"
                  properties:
                    value: { type: "integer" }
                    changePercentage: { type: "number" }
                    isPositive: { type: "boolean" }
                    target: { type: "integer" }
                    progressPercentage: { type: "number" }
                pending_bookings:
                  type: "object"
                  properties:
                    value: { type: "integer" }
                    changePercentage: { type: "number" }
                    isPositive: { type: "boolean" }
                    target: { type: "integer" }
                    progressPercentage: { type: "number" }
                active_users:
                  type: "object"
                  properties:
                    value: { type: "integer" }
                    changePercentage: { type: "number" }
                    isPositive: { type: "boolean" }
                    target: { type: "integer" }
                    progressPercentage: { type: "number" }
                total_revenue:
                  type: "object"
                  properties:
                    value: { type: "number" }
                    changePercentage: { type: "number" }
                    isPositive: { type: "boolean" }
                    target: { type: "number" }
                    progressPercentage: { type: "number" }
                booking_trend:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      date: { type: "string", format: "date", description: "日期 (YYYY-MM-DD)" }
                      count: { type: "integer", description: "当日预约数量" }
                      revenue: { type: "number", description: "当日收入金额" }
                    required: ["date", "count", "revenue"]
                  description: "预约趋势图表数据（按日期升序排列），最近 7 天"
                service_popularity:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      service_name: { type: "string", description: "服务名称" }
                      count: { type: "integer", description: "预约数量" }
                      percentage: { type: "number", description: "占比百分比" }
                  description: "服务预约分布"
                time_distribution:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      hour: { type: "integer", description: "小时 (0-23)" }
                      count: { type: "integer", description: "该小时预约数量" }
                  description: "小时级别预约分布（整数小时，用于图表数据绑定）"

      booking_trends:
        method: "GET"
        path: "/v1/admin/stats/booking-trends"
        authentication: true
        authorization: ["ADMIN", "SUPER_ADMIN"]
        rate_limit: "30次/分钟/IP"
        query_parameters:
          range: { type: "string", enum: ["weekly", "monthly", "yearly"], default: "weekly", description: "时间范围粒度" }
          granularity: { type: "string", enum: ["day", "week", "month"], default: "day", description: "数据聚合粒度" }
          timeRange: { type: "string", enum: ["last24h", "last7d", "last30d", "thisMonth", "lastMonth", "custom"], required: false, description: "时间范围筛选" }
          startDate: { type: "string", format: "date", required: false, description: "自定义起始日期" }
          endDate: { type: "string", format: "date", required: false, description: "自定义结束日期" }
        response:
            success:
              status: 200
              body:
                type: "array"
                items:
                  type: "object"
                  properties:
                    date: { type: "string", format: "date", description: "日期 (YYYY-MM-DD)" }
                    count: { type: "integer", description: "当日预约数量" }
                    revenue: { type: "number", description: "当日收入金额" }
                  required: ["date", "count", "revenue"]
                description: "预约趋势图表数据（按日期升序排列）"

      service_distribution:
        method: "GET"
        path: "/v1/admin/stats/service-distribution"
        authentication: true
        authorization: ["ADMIN", "SUPER_ADMIN"]
        rate_limit: "30次/分钟/IP"
        query_parameters:
          timeRange: { type: "string", enum: ["last24h", "last7d", "last30d", "thisMonth", "lastMonth", "custom"], required: false, description: "时间范围筛选" }
          startDate: { type: "string", format: "date", required: false, description: "自定义起始日期" }
          endDate: { type: "string", format: "date", required: false, description: "自定义结束日期" }
        response:
          success:
            status: 200
            body:
              type: "array"
              items:
                type: "object"
                properties:
                  service_name: { type: "string", description: "服务名称" }
                  count: { type: "integer", description: "预约数量" }
                  percentage: { type: "number", description: "占比百分比" }

      time_distribution:
        method: "GET"
        path: "/v1/admin/stats/time-distribution"
        authentication: true
        authorization: ["ADMIN", "SUPER_ADMIN"]
        rate_limit: "30次/分钟/IP"
        # x-frontend-driver: BookingDistributionPanelComponent "Time" button → Custom Range → DatePicker panel (From/To) → Apply → timeRange=custom + startDate + endDate
        query_parameters:
          timeRange: { type: "string", enum: ["last24h", "last7d", "last30d", "thisMonth", "lastMonth", "custom"], required: false, description: "时间范围筛选" }
          startDate: { type: "string", format: "date", required: false, description: "自定义起始日期" }
          endDate: { type: "string", format: "date", required: false, description: "自定义结束日期" }
        response:
          success:
            status: 200
            body:
              type: "array"
              items:
                type: "object"
                properties:
                  hour: { type: "integer", description: "小时 (0-23)" }
                  count: { type: "integer", description: "该小时预约数量" }

      system:
        health:
          method: "GET"
          path: "/v1/admin/system/health"
          authentication: true
          authorization: ["ADMIN", "SUPER_ADMIN"]
          rate_limit: "30次/分钟/IP"
          description: "SYS-001: System health metrics for dashboard system status card"
          refresh:
            mode: "websocket_push"
            event: "system.health.updated"
            fallback: "poll_every_60s"
            fallback_endpoint: "GET /v1/admin/system/health"
          response:
            success:
              status: 200
              body:
                type: "object"
                properties:
                  server: { type: "string", description: "Server status indicator (Online/Degraded/Offline)" }
                  database: { type: "string", description: "Database status indicator (Online/Degraded/Offline)" }
                  api: { type: "string", description: "API status indicator (Online/Degraded/Offline)" }
                  redis: { type: "string", description: "Redis status indicator (Online/Degraded/Offline)" }
                  lastBackup: { type: "string", format: "date-time", description: "Timestamp of last database backup (ISO 8601)" }
                  uptime: { type: "string", description: "Uptime percentage display string (e.g. '99.9%')" }
        metrics:
          method: "GET"
          path: "/v1/admin/system/metrics"
          authentication: true
          authorization: ["ADMIN", "SUPER_ADMIN"]
          rate_limit: "30次/分钟/IP"
          description: "SYS-002: Detailed system metrics (CPU, memory, disk) for expanded system status card"
          response:
            success:
              status: 200
              body:
                type: "object"
                properties:
                  cpuUsage: { type: "number", description: "CPU usage percentage (0-100)" }
                  memoryUsage: { type: "number", description: "Memory usage percentage (0-100)" }
                  diskUsage: { type: "number", description: "Disk usage percentage (0-100)" }

      notifications:
        list:
          method: "GET"
          path: "/v1/admin/notifications"
          authentication: true
          authorization: ["ADMIN", "SUPER_ADMIN"]
          rate_limit: "30次/分钟/IP"
          query_parameters:
            page: { type: "integer", default: 1 }
            limit: { type: "integer", default: 20 }
            unread_only: { type: "boolean", required: false, description: "仅显示未读通知" }
          response:
            success:
              status: 200
              body:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id: { type: "string" }
                        type: { type: "string", enum: ["info", "warning", "error", "success"] }
                        title: { type: "string" }
                        body: { type: "string" }
                        read: { type: "boolean" }
                      created_at: { type: "string", format: "date-time" }
                  total: { type: "integer" }
                  page: { type: "integer" }
                  limit: { type: "integer" }
        mark_read:
          method: "POST"
          path: "/v1/admin/notifications/:id/read"
          authentication: true
          authorization: ["ADMIN", "SUPER_ADMIN"]
          rate_limit: "30次/分钟/IP"
          response:
            success:
              status: 200

      messages:
        list:
          method: "GET"
          path: "/v1/admin/messages"
          authentication: true
          authorization: ["ADMIN", "SUPER_ADMIN"]
          rate_limit: "60次/分钟/IP"
          description: "MSG-001: 获取管理员消息列表（分页）"
          query_parameters:
            page: { type: "integer", default: 1, description: "页码" }
            limit: { type: "integer", default: 20, description: "每页条数" }
          response:
            success:
              status: 200
              body:
                type: "object"
                x-dto: "MessageListResponseDto"
                description: "MSG-001 消息列表响应信封，包含分页元数据和 MessageItemDto 条目数组"
                properties:
                  items:
                    type: "array"
                    x-item-dto: "MessageItemDto"
                    items:
                      type: "object"
                      properties:
                        id: { type: "string", format: "uuid", description: "消息ID" }
                        sender: { type: "string", description: "发送者名称" }
                        subject: { type: "string", description: "消息主题" }
                        body: { type: "string", description: "消息正文" }
                        read: { type: "boolean", description: "是否已读（readAt !== null）" }
                        created_at: { type: "string", format: "date-time", description: "发送时间（wire: snake_case → frontend: createdAt）" }
                  total: { type: "integer" }
                  page: { type: "integer" }
                  limit: { type: "integer" }
        unread_count:
          method: "GET"
          path: "/v1/admin/messages/unread-count"
          authentication: true
          authorization: ["ADMIN", "SUPER_ADMIN"]
          rate_limit: "30次/分钟/IP"
          description: "MSG-004: 获取未读消息数量（用于信封图标角标）"
          response:
            success:
              status: 200
              body:
                type: "object"
                x-dto: "UnreadCountResponseDto"
                description: "MSG-004 未读消息计数响应"
                properties:
                  count: { type: "integer" }

      settings:
        get_business_hours:
          method: "GET"
          path: "/v1/admin/settings/business-hours"
          authentication: true
          authorization: ["ADMIN", "SUPER_ADMIN"]
          rate_limit: "30次/分钟/IP"
          description: "查询当前营业时间配置。返回值中包含诊所默认时区和每日营业时段"
          response:
            success:
              status: 200
              body:
                type: "object"
                properties:
                  timezone:
                    type: "string"
                    description: "诊所默认时区（IANA，如 Asia/Shanghai）"
                    example: "Asia/Shanghai"
                  monday:
                    type: "array"
                    description: "星期一营业时段。空数组表示休息"
                    items: { type: "object", properties: { open: { type: "string", example: "09:00" }, close: { type: "string", example: "17:00" } } }
                  tuesday:
                    type: "array"
                    description: "星期二营业时段"
                    items: { type: "object", properties: { open: { type: "string" }, close: { type: "string" } } }
                  wednesday:
                    type: "array"
                    description: "星期三营业时段"
                    items: { type: "object", properties: { open: { type: "string" }, close: { type: "string" } } }
                  thursday:
                    type: "array"
                    description: "星期四营业时段"
                    items: { type: "object", properties: { open: { type: "string" }, close: { type: "string" } } }
                  friday:
                    type: "array"
                    description: "星期五营业时段"
                    items: { type: "object", properties: { open: { type: "string" }, close: { type: "string" } } }
                  saturday:
                    type: "array"
                    description: "星期六营业时段"
                    items: { type: "object", properties: { open: { type: "string" }, close: { type: "string" } } }
                  sunday:
                    type: "array"
                    description: "星期日营业时段。空数组表示休息"
                    items: { type: "object", properties: { open: { type: "string" }, close: { type: "string" } } }
                  updatedAt:
                    type: "string"
                    format: "date-time"
                    description: "最后更新时间"

        update_business_hours:
          method: "PUT"
          path: "/v1/admin/settings/business-hours"
          authentication: true
          authorization: ["SUPER_ADMIN"]
          rate_limit: "10次/分钟/IP"
          description: "更新营业时间配置（仅 SUPER_ADMIN）。修改即时生效，影响后续时间槽生成"
          request:
            body:
              type: "object"
              required: ["timezone", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
              properties:
                timezone:
                  type: "string"
                  required: true
                  description: "诊所默认时区（IANA）"
                  example: "Asia/Shanghai"
                monday:    { type: "array", items: { type: "object", properties: { open: { type: "string", example: "09:00" }, close: { type: "string", example: "17:00" } }, required: ["open", "close"] } }
                tuesday:   { type: "array", items: { type: "object", properties: { open: { type: "string" }, close: { type: "string" } }, required: ["open", "close"] } }
                wednesday: { type: "array", items: { type: "object", properties: { open: { type: "string" }, close: { type: "string" } }, required: ["open", "close"] } }
                thursday:  { type: "array", items: { type: "object", properties: { open: { type: "string" }, close: { type: "string" } }, required: ["open", "close"] } }
                friday:    { type: "array", items: { type: "object", properties: { open: { type: "string" }, close: { type: "string" } }, required: ["open", "close"] } }
                saturday:  { type: "array", items: { type: "object", properties: { open: { type: "string" }, close: { type: "string" } }, required: ["open", "close"] } }
                sunday:    { type: "array", items: { type: "object", properties: { open: { type: "string" }, close: { type: "string" } }, required: ["open", "close"] } }
          response:
            success:
              status: 200
              body:
                type: "object"
                properties:
                  message: { type: "string", example: "营业时间已更新" }

      users:
