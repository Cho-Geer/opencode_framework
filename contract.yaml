                   confirmed_count: { type: "integer", description: "CONFIRMED 状态的预约数（不会被自动取消）" }
                   total_affected: { type: "integer", description: "受影响预约总数 (pending + confirmed)" }
         
         delete:
            method: "DELETE"
            path: "/v1/admin/services/:id"
           authentication: true
           authorization: ["ADMIN", "SUPER_ADMIN"]
           rate_limit: "20次/分钟/IP"
           response:
             success:
               status: 204
      
      appointments:
