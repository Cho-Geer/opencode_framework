            body:
              type: "object"
              properties:
                name: { type: "string", required: true }
                email: { type: "string", required: true }
                phone: { type: "string" }
                role: { type: "string", enum: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"], default: "CUSTOMER" }
                password: { type: "string", required: false, minLength: 8, description: "可选 — 验证码登录用户可不设置密码" }
                verification_code: { type: "string", required: false, pattern: "^[0-9]{6}$", description: "管理员身份验证码（6位数字）。创建用户前需通过 POST /v1/admin/users/send-code 获取验证码" }
          response:
            success:
              status: 201
              body:
                type: "object"
                properties:
                  id: { type: "string" }
                  name: { type: "string" }
                  email: { type: "string", description: "脱敏展示" }
                  role: { type: "string" }
                  created_at: { type: "string", format: "date-time" }
        
        update:
          method: "PUT"
          path: "/v1/admin/users/:id"
          authentication: true
          authorization: ["ADMIN", "SUPER_ADMIN"]
          rate_limit: "30次/分钟/IP"
          request:
            body:
              type: "object"
              properties:
                name: { type: "string" }
                role: { type: "string", enum: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"] }
                status: { type: "string", enum: ["ACTIVE", "INACTIVE", "BLOCKED"] }
          response:
            success:
              status: 200
              body:
                type: "object"
                properties:
                  id: { type: "string" }
                  name: { type: "string" }
                  role: { type: "string" }
                  status: { type: "string" }
                  updated_at: { type: "string", format: "date-time" }
        
        delete:
          method: "DELETE"
          path: "/v1/admin/users/:id"
          authentication: true
          authorization: ["SUPER_ADMIN"]
          rate_limit: "20次/分钟/IP"
          response:
            success:
              status: 204
        
        send_code:
          method: "POST"
          path: "/v1/admin/users/send-code"
          authentication: true
          authorization: ["SUPER_ADMIN"]
          rate_limit: "5次/分钟/IP"
          description: "发送管理员操作验证码。管理员在执行敏感操作（如创建用户）前需通过验证码验证身份。"
          anti_enumeration: true
          anti_enumeration_note: "无论目标联系方式是否存在对应账户，始终返回 200 OK，防止用户枚举攻击"
          request:
            body:
              type: "object"
              properties:
                contact_type: { type: "string", enum: ["email", "phone"], required: true, description: "联系方式类型：email 或 phone" }
                email: { type: "string", format: "email", required: false, description: "邮箱地址。contact_type=EMAIL 时必填，contact_type=PHONE 时不填" }
                phone: { type: "string", required: false, description: "手机号。contact_type=PHONE 时必填，contact_type=EMAIL 时不填" }
          response:
            success:
              status: 200
              body:
                type: "object"
                properties:
                  masked_contact: { type: "string", description: "脱敏后的联系方式（如 138****5678 或 us***@example.com）。目标无对应联系方式时为 null" }
                  expires_in: { type: "integer", default: 300, description: "验证码有效期（秒），固定 300 秒（5分钟）" }
      
      services:
        list:
          method: "GET"
          path: "/v1/admin/services"
          authentication: true
          authorization: ["ADMIN", "SUPER_ADMIN"]
          rate_limit: "60次/分钟/IP"
          query_parameters:
            page: { type: "integer", default: 1 }
            limit: { type: "integer", default: 10 }
            search: { type: "string", description: "搜索服务名称" }
            active: { type: "boolean", description: "按状态筛选" }
            category: { type: "string", description: "按服务分类筛选" }
          response:
            success:
              status: 200
              body:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id: { type: "string" }
                        name: { type: "string" }
                        description: { type: "string" }
                        duration: { type: "integer" }
                        price: { type: "number", format: "decimal" }
                        active: { type: "boolean" }
                        category: { type: "string" }
                        image_url: { type: "string" }
                        price_per_minute: { type: "number", format: "decimal", description: "每分钟单价" }
                        tax_rate: { type: "number", format: "decimal", description: "税率百分比 (e.g. 8 = 8%). Wire format is percentage." }
                      created_at: { type: "string", format: "date-time" }
                  total: { type: "integer" }
                  page: { type: "integer" }
                  limit: { type: "integer" }

        summary:
          method: "GET"
          path: "/v1/admin/services/summary"
          authentication: true
          authorization: ["ADMIN", "SUPER_ADMIN"]
          rate_limit: "60次/分钟/IP"
          description: "服务管理仪表板摘要数据（总数、分类分布、激活统计）"
          response:
            success:
              status: 200
              body:
                type: "object"
                properties:
                  totalServices: { type: "integer", description: "服务总数" }
                  activeServicesCount: { type: "integer", description: "激活服务数" }
                  inactiveServicesCount: { type: "integer", description: "未激活服务数" }
                  averagePrice: { type: "number", description: "平均价格" }
                  categories:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        category: { type: "string", description: "分类名称" }
                        count: { type: "integer", description: "该分类下服务数量" }

        create:
          method: "POST"
          path: "/v1/admin/services"
          authentication: true
          authorization: ["ADMIN", "SUPER_ADMIN"]
          rate_limit: "20次/分钟/IP"
          request:
            body:
              type: "object"
              properties:
                name: { type: "string", required: true }
                description: { type: "string" }
                duration: { type: "integer", required: true, description: "Duration in minutes" }
                price: { type: "number", format: "decimal" }
                active: { type: "boolean", default: true }
                image_url: { type: "string" }
                price_per_minute: { type: "number", format: "decimal", description: "自动计算：price / duration；不传递则由后端计算" }
                tax_rate: { type: "number", format: "decimal", description: "税率百分比 (e.g. 8 = 8%). API wire format is percentage; DB stores as decimal fraction (0.08)." }
                category: { type: "string", description: "服务分类" }
          response:
            success:
              status: 201
              body:
                type: "object"
                properties:
                  id: { type: "string" }
                  name: { type: "string" }
                  description: { type: "string" }
                  duration: { type: "integer" }
                  price: { type: "number" }
                  active: { type: "boolean" }
                  created_at: { type: "string", format: "date-time" }
                  price_per_minute: { type: "number", format: "decimal" }
                  tax_rate: { type: "number", format: "decimal", description: "税率百分比 (e.g. 8 = 8%). Wire format is percentage." }
          
         update:
            method: "PUT"
            path: "/v1/admin/services/:id"
           authentication: true
           authorization: ["ADMIN", "SUPER_ADMIN"]
           rate_limit: "30次/分钟/IP"
           description: "更新服务信息。当 active 从 true 变为 false（禁用服务）时，自动级联取消该服务下所有状态为 PENDING 的预约。CONFIRMED/COMPLETED 状态的预约保持不变，由管理员手动处理。"
           cascade_behavior:
             trigger: "active: false (服务从激活变为禁用)"
             action: "自动取消所有 PENDING 预约 → 状态变更为 CANCELLED"
             reason: "remarks 字段写入 'Service \"{serviceName}\" was disabled by admin'"
             non_affected: "CONFIRMED, COMPLETED, CANCELLED, EXPIRED 状态的预约不受影响"
             notifications: "向管理员发送 WebSocket 通知和邮件通知（复用 batchCancel 通知管道）"
             audit_log: "每条取消记录创建 activity_log 条目（action: BOOKING_CANCEL）"
           request:
             body:
               type: "object"
               properties:
                 name: { type: "string" }
                 description: { type: "string" }
                 duration: { type: "integer" }
                 price: { type: "number" }
                 active: { type: "boolean" }
                 image_url: { type: "string" }
                 price_per_minute: { type: "number", format: "decimal", description: "自动计算：price / duration；不传递则由后端计算" }
                 tax_rate: { type: "number", format: "decimal", description: "税率百分比 (e.g. 8 = 8%). Wire format is percentage." }
                 category: { type: "string", description: "服务分类" }
           response:
             success:
               status: 200
               body:
                 type: "object"
                 properties:
                   id: { type: "string" }
                   name: { type: "string" }
                   duration: { type: "integer" }
                   price: { type: "number" }
                   active: { type: "boolean" }
                   updated_at: { type: "string", format: "date-time" }
                   price_per_minute: { type: "number", format: "decimal" }
                   tax_rate: { type: "number", format: "decimal", description: "税率百分比 (e.g. 8 = 8%). Wire format is percentage." }
                   cascade:
                     type: "object"
                     description: "仅当 active: false 且存在 PENDING 预约时返回"
                     properties:
                       cancelled_count: { type: "integer", description: "成功取消的 PENDING 预约数量" }
                       failed_count: { type: "integer", description: "取消失败的预约数量" }
        
        image_upload:
          method: "POST"
