name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'booking-frontend/**'
      - 'booking-backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'booking-frontend/**'
      - 'booking-backend/**'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test against'
        required: false
        default: 'local'
        type: choice
        options:
          - local
          - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  POSTGRES_DB: e2e_test_db
  POSTGRES_USER: e2e_user
  POSTGRES_PASSWORD: e2e_password
  DATABASE_URL: postgresql://e2e_user:e2e_password@localhost:5432/e2e_test_db?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_SECRET: e2e-test-secret-not-for-production
  JWT_REFRESH_SECRET: e2e-test-refresh-secret-not-for-production
  FRONTEND_PORT: 4200
  BACKEND_PORT: 3000

jobs:
  e2e-full-stack:
    name: Full Stack E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- Backend Setup ----
      - name: CI Setup (Backend)
        uses: ./.github/actions/ci-setup
        with:
          working_directory: booking-backend
          node_version: ${{ env.NODE_VERSION }}
          run_prisma_generate: 'true'

      - name: Run database migrations
        working-directory: ./booking-backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed test data
        working-directory: ./booking-backend
        run: npx prisma db seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Start backend server
        working-directory: ./booking-backend
        run: npm run start:dev &
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          NODE_ENV: development
          E2E_REDIS_URL: redis://localhost:6379
          PORT: ${{ env.BACKEND_PORT }}

      - name: Wait for backend health
        run: |
          echo "Waiting for backend to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:${{ env.BACKEND_PORT }}/v1/health > /dev/null 2>&1; then
              echo "Backend is healthy!"
              curl -sf http://localhost:${{ env.BACKEND_PORT }}/v1/health
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start within timeout"
          exit 1

      # ---- Frontend Setup ----
      - name: CI Setup (Frontend)
        uses: ./.github/actions/ci-setup
        with:
          working_directory: booking-frontend
          node_version: ${{ env.NODE_VERSION }}

      - name: Build frontend for production
        working-directory: ./booking-frontend
        run: npm run build -- --configuration production

      - name: Serve frontend
        working-directory: ./booking-frontend
        run: npx http-server dist/booking-frontend -p ${{ env.FRONTEND_PORT }} -s &

      - name: Wait for frontend
        run: |
          echo "Waiting for frontend to be serving..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:${{ env.FRONTEND_PORT }} > /dev/null 2>&1; then
              echo "Frontend is serving!"
              exit 0
            fi
            echo "Waiting for frontend... ($i/15)"
            sleep 2
          done
          echo "Frontend failed to start within timeout"
          exit 1

      # ---- Playwright E2E Tests ----
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('booking-frontend/package-lock.json', 'booking-backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Run Playwright E2E tests
        working-directory: .
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:${{ env.FRONTEND_PORT }}
          BACKEND_BASE_URL: http://localhost:${{ env.BACKEND_PORT }}
          NODE_ENV: test
          E2E_REDIS_URL: redis://localhost:6379

      - name: Upload E2E test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 30

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: test-results/**/*.png
          retention-days: 30

      - name: Upload trace files for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-trace-files
          path: test-results/**/trace.zip
          retention-days: 30

  e2e-summary:
    name: E2E Test Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [e2e-full-stack]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ needs.e2e-full-stack.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.e2e-full-stack.result }}" = "success" ]; then
            echo "All E2E tests passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "Some E2E tests failed. Check the artifacts for details." >> $GITHUB_STEP_SUMMARY
          fi

