<header
  class="sticky top-0 z-50 transition-all duration-300 bg-card-bg border-b border-border-color shadow-sm"
  [class.shadow-md]="scrollY() > 10"
>
  <div class="flex items-center justify-between h-16 px-4 sm:px-6">
    <!-- Left: Hamburger + Logo -->
    <div class="flex items-center gap-3">
      <button
        (click)="toggleSidebar()"
        class="lg:hidden w-10 h-10 flex items-center justify-center rounded-lg hover:bg-card-bg-light transition-colors"
        [attr.aria-label]="'global.toggleMenu' | t"
      >
        <i class="pi pi-bars text-text-secondary"></i>
      </button>
      <a routerLink="/" class="flex items-center gap-2 text-lg font-bold gradient-text">
        <div
          class="w-7 h-7 rounded-lg bg-gradient-to-r from-accent-green to-accent-green-dark flex items-center justify-center shadow-glow-green"
        >
          <i class="pi pi-calendar text-white text-xs"></i>
        </div>
        BookSys
      </a>
    </div>

    <!-- Center: Search Bar (desktop) - only shown when showSearch is true -->
    @if (showSearch()) {
      <div class="hidden md:block">
        <div class="relative">
          <i
            class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary text-sm"
          ></i>
          <input
            type="text"
            [placeholder]="'global.search' | t"
            class="w-64 pl-10 pr-4 py-2 rounded-lg border border-border-color bg-bg-primary text-text-primary text-sm focus:outline-none focus:border-accent-green focus:ring-1 focus:ring-accent-green/30 placeholder:text-text-disabled transition-colors"
          />
        </div>
      </div>
    }

    <!-- Right: Actions -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Extra Actions slot -->
      @if (extraActions(); as tmpl) {
        <ng-container [ngTemplateOutlet]="tmpl" />
      }

      <!-- Notifications: full component for admin, simple badge for non-admin -->
      @if (isAdmin()) {
        <app-notification-bell />
      } @else {
        <button
          class="relative w-10 h-10 flex items-center justify-center rounded-lg hover:bg-card-bg-light transition-colors"
          [attr.aria-label]="'notifications.title' | t"
        >
          <i class="pi pi-bell text-text-secondary text-lg"></i>
          @if (notificationCount() && notificationCount()! > 0) {
            <span
              data-testid="notification-badge"
              class="absolute top-1.5 right-1.5 min-w-[18px] h-[18px] flex items-center justify-center px-1 rounded-full text-[10px] font-bold bg-accent-red text-white"
            >
              {{ notificationCount() }}
            </span>
          }
        </button>
      }

      <!-- Messages -->
      <div class="hidden sm:flex" (click)="onMessagesAreaClick()">
        <app-messages-dropdown [messageCount]="effectiveMessageCount()" [messages]="effectiveMessages()" />
      </div>

      <!-- Settings -->
      <button
        class="hidden sm:flex w-10 h-10 items-center justify-center rounded-lg hover:bg-card-bg-light transition-colors"
        [attr.aria-label]="'global.settings' | t"
      >
        <i class="pi pi-cog text-text-secondary text-lg"></i>
      </button>

      <!-- Theme Toggle -->
      <app-theme-toggle />

      <!-- User -->
      @if (userName()) {
        <div class="relative flex items-center gap-2">
          @if (isAdmin()) {
            <span
              data-testid="admin-badge"
              class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium bg-accent-green/10 text-accent-green border border-accent-green/20"
            >
              {{ userRole() }}
            </span>
          }
          <button
            (click)="menu.toggle($event)"
            class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-card-bg-light transition-colors"
          >
            <div
              class="w-8 h-8 rounded-lg bg-gradient-to-r from-accent-green to-accent-green-dark flex items-center justify-center text-white text-sm font-bold"
            >
              {{ userName()!.charAt(0).toUpperCase() }}
            </div>
            <span class="hidden sm:block text-sm font-medium text-text-primary">{{
              userName()
            }}</span>
          </button>
          <p-menu #menu [model]="menuItems()" [popup]="true" appendTo="body" />
        </div>
      } @else {
        <a
          routerLink="/auth/login"
          class="px-4 py-2 rounded-lg bg-accent-green hover:bg-accent-green-dark text-white text-sm font-medium transition-colors"
        >
          {{ 'auth.login.title' | t }}
        </a>
      }
    </div>
  </div>
</header>
