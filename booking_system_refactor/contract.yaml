# ============================================================
# 11. PII 加密契约扩展 (方案 C v4, TASK-D1)
# ============================================================

pii_encryption_contract:
  version: "1.0.0-draft"
  generated_by: "@Architect (TASK-D1)"
  generated_date: "2026-04-21"
  design_doc: ".qoder/context/requirements/piiEncryptionStrategy.md"

  # User 三字段 PII 加密模型
  user_pii_model:
    description: >
      每个 PII 字段（phone/email）拆分为三个物理列：
      明文脱敏展示列、SHA-256 哈希唯一索引列、AES-256-GCM 加密密文列。
    phone_fields:
      - name: phone
        type: "string (nullable)"
        content: "脱敏掩码字符串（如 138****5678）"
        exposure: "前端展示允许"
        unique: false
      - name: phoneHash
        type: "string (nullable)"
        content: "SHA-256(phone_plaintext + PII_HASH_PEPPER)"
        exposure: "禁止暴露给前端"
        unique: true
        index: "@unique"
      - name: phoneEncrypted
        type: "string (nullable)"
        content: "AES-256-GCM 密文（格式：iv:authTag:ciphertext，Base64）"
        exposure: "禁止暴露给前端"
        unique: false
    email_fields:
      - name: email
        type: "string (nullable)"
        content: "脱敏掩码字符串（如 us***@example.com）"
        exposure: "前端展示允许"
        unique: false
      - name: emailHash
        type: "string (nullable)"
        content: "SHA-256(email_plaintext + PII_HASH_PEPPER)"
        exposure: "禁止暴露给前端"
        unique: true
        index: "@unique"
      - name: emailEncrypted
        type: "string (nullable)"
        content: "AES-256-GCM 密文（格式：iv:authTag:ciphertext，Base64）"
        exposure: "禁止暴露给前端"
        unique: false
    password_field:
      name: passwordHash
      type: "string (nullable)"
      content: "bcrypt 哈希（rounds=12，OWASP 2023）"
      exposure: "禁止暴露给前端"

  # JWT Payload 约束（移除 email，符合 NIST SP 800-63B）
  jwt_payload_contract:
    access_token:
      required_fields: [sub, roles, iat, exp, jti]
      forbidden_fields: [email, phone]
      note: "JWT 仅签名非加密，禁止在 Payload 中携带任何 PII 字段"
    refresh_token:
      required_fields: [sub, tokenFamily, iat, exp]
      forbidden_fields: [email, phone]

  # Auth 端点契约（方案 C v4 专用）
  auth_endpoints:
    register_send_code:
      method: POST
      path: "/v1/auth/register/send-code"
      auth_required: false
      rate_limit: "5次/分钟/contact"
      request_body:
        contact: "string (手机号或邮箱原文)"
        contactType: "enum: phone | email"
      success_response:
        status: 200
        body:
          statusCode: 200
          message: "验证码已发送，请在 5 分钟内完成验证"
          data:
            maskedContact: "string"
            expiresIn: 300
          timestamp: "ISO 8601"
      error_responses:
        409: "手机号/邮箱已注册"
        429: "超出限流"

    register_complete:
      method: POST
      path: "/v1/auth/register/complete"
      auth_required: false
      rate_limit: "10次/分钟/IP"
      request_body:
        contact: "string"
        contactType: "enum: phone | email"
        code: "string (6位数字)"
        password: "string (minLength=8)"
        name: "string"
      success_response:
        status: 201
        body:
          statusCode: 201
          message: "注册成功"
          data:
            accessToken: "string"
            refreshToken: "string"
            expiresIn: 900
            tokenType: "Bearer"
          timestamp: "ISO 8601"
      error_responses:
        400: "验证码无效或已过期"
        409: "手机号/邮箱已注册（并发）"

    login_send_code:
      method: POST
      path: "/v1/auth/login/send-code"
      auth_required: false
      rate_limit: "5次/分钟/contact"
      request_body:
        contact: "string"
        contactType: "enum: phone | email"
      success_response:
        status: 200
        body:
          statusCode: 200
          message: "验证码已发送"
          data:
            expiresIn: 300
          timestamp: "ISO 8601"
      note: "为防止用户枚举，用户不存在时也返回 200"

    login_verify_code:
      method: POST
      path: "/v1/auth/login/verify-code"
      auth_required: false
      rate_limit: "10次/分钟/contact"
      request_body:
        contact: "string"
        contactType: "enum: phone | email"
        code: "string (6位数字)"
      success_response:
        status: 200
        body:
          statusCode: 200
          message: "登录成功"
          data:
            accessToken: "string"
            refreshToken: "string"
            expiresIn: 900
            tokenType: "Bearer"
          timestamp: "ISO 8601"
      error_responses:
        401: "验证码无效或已过期"
        404: "用户不存在"

    login_password:
      method: POST
      path: "/v1/auth/login/password"
      auth_required: false
      rate_limit: "5次/分钟/contact"
      request_body:
        contact: "string"
        contactType: "enum: phone | email"
        password: "string (minLength=8)"
      success_response:
        status: 200
        body:
          statusCode: 200
          message: "登录成功"
          data:
            accessToken: "string"
            refreshToken: "string"
            expiresIn: 900
            tokenType: "Bearer"
          timestamp: "ISO 8601"
      error_responses:
        401: "凭证无效"
        429: "超出限流"

    # [TASK-D5 修复] 补充 refresh 和 logout，确保 pii_encryption_contract 自包含
    refresh:
      method: POST
      path: "/v1/auth/refresh"
      auth_required: false
      rate_limit: "10次/分钟/IP"
      request_body:
        refreshToken: "string"
      success_response:
        status: 200
        body:
          statusCode: 200
          message: "Token 已刷新"
          data:
            accessToken: "string"
            refreshToken: "string"
            expiresIn: 900
            tokenType: "Bearer"
          timestamp: "ISO 8601"
      error_responses:
        401: "Refresh Token 无效或已过期"
      note: "实现 Token 旋转（Rotation）：每次刷新废弃旧 Refresh Token，签发新的"

    logout:
      method: POST
      path: "/v1/auth/logout"
      auth_required: true
      rate_limit: "无"
      success_response:
        status: 200
        body:
          statusCode: 200
          message: "登出成功"
          data:
            message: "已清除会话"
          timestamp: "ISO 8601"
      error_responses:
        401: "未认证"
      note: "将当前 Access Token 加入黑名单，吊销 Refresh Token"

  # 密钥管理契约
  secret_management:
    PII_ENCRYPTION_KEY:
      purpose: "AES-256-GCM 加密/解密 PII 字段"
      storage: "环境变量 / K8s Secret"
      rotation: "每年"
      required: true
    PII_HASH_PEPPER:
      purpose: "SHA-256 哈希 pepper，防彩虹表"
      storage: "环境变量 / K8s Secret"
      rotation: "永久不可更换（一旦设置）"
      required: true
      warning: "修改此值会导致所有用户无法登录，需全量迁移"

# ============================================================
# End of Contract (PII 加密扩展)
