# Booking System Architecture Contract
# Generated by @Architect for T002 task
# Version: 1.2.0
# Date: 2026-04-15
# Last Sync: 2026-04-21 (Requirements Alignment)

# ============================================
# 1. Project Information
# ============================================

project:
  name: "Booking System Angular+NestJS Refactor"
  version: "1.0.0"
  description: "Modern appointment booking system with high-concurrency handling"
  repository: "booking_system_refactor"
  
  technology_stack:
    frontend:
      framework: "Angular v21+"
      ui_library: "PrimeNG + Tailwind CSS v4"
      state_management: "NgRx Signals (@ngrx/signals)"
      testing: "Jest + Angular Testing Library"
      e2e_testing: "Playwright"
    
    backend:
      framework: "NestJS v11+"
      runtime: "Node.js 22.x LTS"
      orm: "Prisma 6.16.2+"
      authentication: "JWT + Passport"
      security: "helmet, CORS, CSRF protection"
      testing: "Jest + Supertest + Testcontainers"
    
    database:
      primary: "PostgreSQL 16"
      cache: "Redis 7.x"
      queue: "BullMQ (Redis backend)"
    
    deployment:
      container_runtime: "Docker 24.x"
      orchestration: "Docker Compose v2"
      ci_cd: "GitHub Actions"
      registry: "Docker Hub"

# ============================================
# 2. API Contract
# ============================================

api:
  base_path: "/v1"
  versioning_strategy: "URI path versioning"
  default_content_type: "application/json"
  
  authentication:
    type: "JWT Bearer Token"
    token_lifetime: "15 minutes"
    refresh_token_lifetime: "7 days"
    endpoints:
      # [方案 C v4 TASK-D5 修复] 旧单步端点已废弃，替换为分步端点
      login_password: "POST /v1/auth/login/password"           # 密码登录
      login_send_code: "POST /v1/auth/login/send-code"         # 验证码登录第一步
      login_verify_code: "POST /v1/auth/login/verify-code"     # 验证码登录第二步
      register_send_code: "POST /v1/auth/register/send-code"   # 注册第一步
      register_complete: "POST /v1/auth/register/complete"     # 注册第二步
      refresh: "POST /v1/auth/refresh"
      logout: "POST /v1/auth/logout"
      # deprecated (勿用，已被上方分步端点替代)
      login_legacy_DEPRECATED: "POST /v1/auth/login"
      register_legacy_DEPRECATED: "POST /v1/auth/register"
  
  endpoints:
    
    # Auth endpoints
    # [方案 C v4 TASK-D5 修复] 以下旧端点已废弃，请使用 pii_encryption_contract.auth_endpoints 中的分步端点
    auth:
      # ⚠️ DEPRECATED: 不再使用，由 /auth/login/password 和 /auth/login/send-code + verify-code 替代
      login_DEPRECATED:
        deprecated: true
        replacement: "POST /v1/auth/login/password (密码登录) 或 POST /v1/auth/login/send-code + /verify-code (验证码登录)"
        method: "POST"
        path: "/auth/login"
        request:
          body:
            type: "object"
            properties:
              email:
                type: "string"
                format: "email"
                required: true
              password:
                type: "string"
                minLength: 8
                required: true
        response:
          success:
            status: 200
            body:
              type: "object"
              properties:
                access_token: { type: "string" }
                refresh_token: { type: "string" }
                user:
                  type: "object"
                  properties:
                    id: { type: "string" }
                    email: { type: "string" }
                    name: { type: "string" }
                    role: { type: "string", enum: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"] }
          error:
            status: 401
            body:
              type: "object"
              properties:
                error: { type: "string", example: "Invalid credentials" }
      
      # ⚠️ DEPRECATED: 不再使用，由 /auth/register/send-code + /register/complete 替代
      register_DEPRECATED:
        deprecated: true
        replacement: "POST /v1/auth/register/send-code (第一步) + POST /v1/auth/register/complete (第二步)"
        method: "POST"
        path: "/auth/register"
        request:
          body:
            type: "object"
            properties:
              email:
                type: "string"
                format: "email"
                required: true
              password:
                type: "string"
                minLength: 8
                required: true
              name:
                type: "string"
                required: true
        response:
          success:
            status: 201
            body:
              type: "object"
              properties:
                user:
                  type: "object"
                  properties:
                    id: { type: "string" }
                    email: { type: "string" }
                    name: { type: "string" }
                    role: { type: "string", enum: ["CUSTOMER"] }
          error:
            status: 400
            body:
              type: "object"
              properties:
                error: { type: "string", example: "User already exists" }
    
    # User endpoints
    users:
      get_profile:
        method: "GET"
        path: "/v1/users/profile"
        authentication: true
        authorization: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"]
        response:
          success:
            status: 200
            body:
              type: "object"
              properties:
                id: { type: "string" }
                email: { type: "string" }
                name: { type: "string" }
                role: { type: "string", enum: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"] }
                created_at: { type: "string", format: "date-time" }
      
      update_profile:
        method: "PUT"
        path: "/v1/users/profile"
        authentication: true
        authorization: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"]
        request:
          body:
            type: "object"
            properties:
              name: { type: "string" }
              email: { type: "string", format: "email" }
        response:
          success:
            status: 200
            body:
              type: "object"
              properties:
                user:
                  type: "object"
                  properties:
                    id: { type: "string" }
                    email: { type: "string" }
                    name: { type: "string" }
                    role: { type: "string", enum: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"] }
    
    # Appointment endpoints
    appointments:
      create:
        method: "POST"
        path: "/v1/appointments"
        authentication: true
        authorization: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"]
        high_concurrency: true
        request:
          body:
            type: "object"
            properties:
              time_slot_id: { type: "string", required: true }
              appointment_date: { type: "string", format: "date-time", required: true }
              notes: { type: "string" }
        response:
          success:
            status: 201
            body:
              type: "object"
              properties:
                booking:
                  type: "object"
                  properties:
                    id: { type: "string" }
                    user_id: { type: "string" }
                    time_slot_id: { type: "string" }
                    appointment_date: { type: "string", format: "date-time" }
                    status: { type: "string", enum: ["PENDING", "CONFIRMED", "CANCELLED", "COMPLETED"] }
                    slot_sequence: { type: "integer" }
                    created_at: { type: "string", format: "date-time" }
          conflict:
            status: 409
            body:
              type: "object"
              properties:
                error: { type: "string", example: "Time slot is already booked" }
      
      list:
        method: "GET"
        path: "/v1/appointments"
        authentication: true
        authorization: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"]
        query_parameters:
          start_date: { type: "string", format: "date" }
          end_date: { type: "string", format: "date" }
          status: { type: "string", enum: ["PENDING", "CONFIRMED", "CANCELLED", "COMPLETED"] }
        response:
          success:
            status: 200
            body:
              type: "array"
              items:
                type: "object"
                properties:
                  id: { type: "string" }
                  time_slot_id: { type: "string" }
                  appointment_date: { type: "string", format: "date-time" }
                  status: { type: "string", enum: ["PENDING", "CONFIRMED", "CANCELLED", "COMPLETED"] }
                  service_name: { type: "string" }
                  time_slot_start: { type: "string", format: "date-time" }
                  time_slot_end: { type: "string", format: "date-time" }
    
    # Service endpoints
    services:
      list:
        method: "GET"
        path: "/v1/services"
        authentication: true
        response:
          success:
            status: 200
            body:
              type: "array"
              items:
                type: "object"
                properties:
                  id: { type: "string" }
                  name: { type: "string" }
                  description: { type: "string" }
                  duration: { type: "integer", description: "Duration in minutes" }
                  price: { type: "number", format: "decimal" }
                  active: { type: "boolean" }
    
    # Time slot endpoints
    time_slots:
      available:
        method: "GET"
        path: "/v1/time-slots/available"
        authentication: true
        query_parameters:
          service_id: { type: "string", required: true }
          date: { type: "string", format: "date", required: true }
        response:
          success:
            status: 200
            body:
              type: "array"
              items:
                type: "object"
                properties:
                  id: { type: "string" }
                  start_time: { type: "string", format: "date-time" }
                  end_time: { type: "string", format: "date-time" }
                  capacity: { type: "integer" }
                  booked_count: { type: "integer" }
                  available: { type: "boolean" }
  
  error_responses:
    format:
      type: "object"
      properties:
        statusCode: { type: "integer" }
        message: { type: "string" }
        error: { type: "string" }
        timestamp: { type: "string", format: "date-time" }
        path: { type: "string" }
    
    status_codes:
      400: "Bad Request - Validation error"
      401: "Unauthorized - Authentication required"
      403: "Forbidden - Insufficient permissions"
      404: "Not Found - Resource not found"
      409: "Conflict - Resource conflict (e.g., time slot already booked)"
      429: "Too Many Requests - Rate limit exceeded"
      500: "Internal Server Error"

# ============================================
# 3. Data Model Contract
# ============================================

data_models:
  
  # User model (PII 三字段模型 - 方案 C v4)
  user:
    description: "System user with authentication and PII-encrypted profile"
    fields:
      id:
        type: "string"
        format: "uuid"
        primary_key: true
      name:
        type: "string"
        required: true
        description: "用户姓名"
      
      # Phone 三字段（PII 加密）
      phone:
        type: "string (nullable)"
        description: "脱敏掩码（如 138****5678）"
        unique: false
      phoneHash:
        type: "string (nullable)"
        description: "SHA-256(phone_plaintext + PII_HASH_PEPPER)"
        unique: true
        sensitive: true
      phoneEncrypted:
        type: "string (nullable)"
        description: "AES-256-GCM 密文"
        sensitive: true
      
      # Email 三字段（PII 加密）
      email:
        type: "string (nullable)"
        description: "脱敏掩码（如 us***@example.com）"
        unique: false
      emailHash:
        type: "string (nullable)"
        description: "SHA-256(email_plaintext + PII_HASH_PEPPER)"
        unique: true
        sensitive: true
      emailEncrypted:
        type: "string (nullable)"
        description: "AES-256-GCM 密文"
        sensitive: true
      
      passwordHash:
        type: "string"
        required: true
        sensitive: true
        description: "bcrypt 哈希（rounds=12）"
      
      userType:
        type: "string"
        enum: ["CUSTOMER", "ADMIN", "SUPER_ADMIN"]
        default: "CUSTOMER"
      status:
        type: "string"
        enum: ["ACTIVE", "INACTIVE", "BLOCKED"]
        default: "ACTIVE"
      lastLoginAt:
        type: "datetime"
        nullable: true
      deviceInfo:
        type: "json"
        nullable: true
      remarks:
        type: "text"
        nullable: true
      createdAt:
        type: "datetime"
        default: "now()"
      updatedAt:
        type: "datetime"
        default: "now()"
        auto_update: true
    
    indexes:
      - fields: ["emailHash"]
        unique: true
      - fields: ["phoneHash"]
        unique: true
      - fields: ["userType", "status"]
      - fields: ["createdAt"]
      - fields: ["lastLoginAt"]
    
    relationships:
      sessions: { type: "has_many", target: "user_session" }
      appointments: { type: "has_many", target: "appointment" }
      notifications: { type: "has_many", target: "notification" }
      activityLogs: { type: "has_many", target: "activity_log" }
  
  # Service model
  service:
    description: "Service offered by the business"
    fields:
      id:
        type: "string"
        format: "uuid"
        primary_key: true
      name:
        type: "string"
        required: true
      description:
        type: "string"
      duration:
        type: "integer"
        description: "Duration in minutes"
        required: true
      price:
        type: "decimal"
        precision: 10
        scale: 2
      active:
        type: "boolean"
        default: true
      created_at:
        type: "datetime"
        default: "now()"
      updated_at:
        type: "datetime"
        default: "now()"
        auto_update: true
    
    indexes:
      - fields: ["name"]
      - fields: ["active", "created_at"]
    
    relationships:
      time_slots: { type: "has_many", target: "time_slot" }
  
  # Time slot model
  time_slot:
    description: "Available time slot for appointments"
    fields:
      id:
        type: "string"
        format: "uuid"
        primary_key: true
      service_id:
        type: "string"
        format: "uuid"
        required: true
      start_time:
        type: "datetime"
        required: true
      end_time:
        type: "datetime"
        required: true
      capacity:
        type: "integer"
        default: 1
        description: "Maximum number of simultaneous appointments"
      current_sequence:
        type: "integer"
        default: 0
        description: "Current sequence number for atomic booking"
      created_at:
        type: "datetime"
        default: "now()"
      updated_at:
        type: "datetime"
        default: "now()"
        auto_update: true
    
    indexes:
      - fields: ["service_id", "start_time", "end_time"]
      - fields: ["start_time"]
      - fields: ["capacity", "current_sequence"]
    
    relationships:
      service: { type: "belongs_to", target: "service" }
      bookings: { type: "has_many", target: "booking" }
  
  # Appointment model (formerly Booking)
  appointment:
    description: "Appointment booking with high-concurrency handling"
    fields:
      id:
        type: "string"
        format: "uuid"
        primary_key: true
      userId:
        type: "string"
        format: "uuid"
        required: true
      timeSlotId:
        type: "string"
        format: "uuid"
        required: true
      serviceId:
        type: "string"
        format: "uuid"
        required: true
      appointmentNumber:
        type: "string"
        unique: true
        description: "Unique appointment number"
      appointmentDate:
        type: "datetime"
        required: true
      slotSequence:
        type: "integer"
        default: 0
        description: "Sequence number for atomic booking"
      status:
        type: "string"
        enum: ["PENDING", "CONFIRMED", "CANCELLED", "COMPLETED", "EXPIRED"]
        default: "PENDING"
      customerInfo:
        type: "json"
        description: "Customer information (JSON format)"
      remarks:
        type: "text"
      createdAt:
        type: "datetime"
        default: "now()"
      updatedAt:
        type: "datetime"
        default: "now()"
        auto_update: true
    
    indexes:
      # Core partial unique index for high-concurrency handling
      - fields: ["timeSlotId", "appointmentDate", "slotSequence"]
        unique: true
        map: "appointment_slot_occupied"
      - fields: ["userId", "appointmentDate"]
      - fields: ["timeSlotId", "appointmentDate", "status"]
      - fields: ["appointmentNumber"]
      - fields: ["status", "appointmentDate"]
    
    relationships:
      user: { type: "belongs_to", target: "user" }
      timeSlot: { type: "belongs_to", target: "time_slot" }
      service: { type: "belongs_to", target: "service" }
      histories: { type: "has_many", target: "appointment_history" }
      notifications: { type: "has_many", target: "notification" }

# ============================================
# 4. High-Concurrency Contract
# ============================================

high_concurrency:
  mechanism: "PostgreSQL Partial Unique Index + slot_sequence"
  description: "Atomic slot allocation using database-level constraints"
  
  components:
    database_constraint:
      type: "partial_unique_index"
      fields: ["time_slot_id", "appointment_date", "slot_sequence"]
      condition: "status IN ('PENDING', 'CONFIRMED', 'COMPLETED')"
      purpose: "Prevent double-booking at database level"
    
    slot_sequence_management:
      source: "time_slot.current_sequence"
      increment_strategy: "Atomic increment on successful booking"
      reset_policy: "Manual or scheduled reset"
    
    rate_limiting:
      layer_1: "Redis-based per-user rate limiting"
      limit: "1 request per second per user per time slot"
      window: "1 second"
      layer_2: "Redis soft limit pre-check"
      purpose: "Reduce database load"
    
    conflict_resolution:
      detection: "Database unique constraint violation"
      response: "HTTP 409 Conflict with specific error message"
      retry_suggestion: "Client should fetch updated available slots"
  
  performance_targets:
    p95_response_time: "< 500ms"
    concurrent_users: "100+"
    bookings_per_second: "1000+ (with optimizations)"

# ============================================
# 5. Security Contract
# ============================================

security:
  authentication:
    method: "JWT + Passport.js"
    token_type: "Bearer"
    access_token_lifetime: "15 minutes"
    refresh_token_lifetime: "7 days"
    refresh_token_storage: "Request body (refresh_token field) + UserSession database table"
    refresh_token_rotation: true
    refresh_token_endpoint: "POST /v1/auth/refresh"
    
  authorization:
    method: "RBAC (Role-Based Access Control)"
    roles:
      CUSTOMER:
        permissions: ["view_own_profile", "create_appointment", "view_own_appointments", "cancel_own_appointment"]
      ADMIN:
        permissions: ["all_customer_permissions", "manage_users", "manage_services", "manage_time_slots", "view_all_appointments"]
      SUPER_ADMIN:
        permissions: ["all_admin_permissions", "system_settings", "view_audit_logs", "manage_admins"]
    
    implementation: "NestJS Guards + Custom Decorators (@Public(), @Roles())"
  
  data_protection:
    password_hashing: "bcrypt with salt rounds 12"
    sensitive_fields: ["password_hash", "refresh_token"]
    encryption_at_rest: "Database field-level encryption for sensitive data"
    
  http_security:
    headers:
      helmet: true
      cors:
        origin: "configured origins"
        credentials: true
      csp: "strict policy"
      hsts: true
      x_frame_options: "DENY"
      x_content_type_options: "nosniff"
      x_xss_protection: "1; mode=block"
    
    csrf_protection: true
    rate_limiting: true
  
  audit_logging:
    enabled: true
    events: ["login", "logout", "booking_creation", "booking_cancellation", "admin_actions"]
    storage: "Database + Winston structured logs"
    retention: "90 days"

# ============================================
# 6. Testing Contract
# ============================================

testing:
  strategy: "TDD (Test-Driven Development) with RED/GREEN/REFACTOR cycles"
  
  layers:
    unit_tests:
      frontend: "Jest + Angular Testing Library"
      backend: "Jest + NestJS testing utilities"
      coverage_target: "≥70%"
    
    integration_tests:
      frontend: "Angular TestBed with mocked services"
      backend: "Supertest + Testcontainers (PostgreSQL, Redis)"
      coverage_target: "≥80%"
    
    e2e_tests:
      tool: "Playwright"
      scenarios:
        - "User registration and login"
        - "Service browsing and booking"
        - "Booking management"
        - "Admin user management"
      coverage_target: "≥90% business process coverage"
    
    performance_tests:
      tool: "k6"
      targets:
        - "API response time P95 < 500ms"
        - "Concurrent user simulation"
        - "High-concurrency booking scenario"
    
    security_tests:
      tools: ["npm audit", "OWASP ZAP", "dependency vulnerability scanning"]
      frequency: "Pre-commit and CI pipeline"
  
  tdd_enforcement:
    rule: "No business code without failing test first"
    process: "RED (write failing test) → GREEN (minimal code) → REFACTOR (improve)"
    gate: "All tests must pass before code review"

# ============================================
# 7. Deployment Contract
# ============================================

deployment:
  environments:
    development:
      docker_compose: "docker-compose.dev.yml"
      database: "PostgreSQL container"
      cache: "Redis container"
      auto_migration: true
      hot_reload: true
    
    production:
      docker_compose: "docker-compose.prod.yml"
      database: "PostgreSQL with persistence volume"
      cache: "Redis with persistence"
      migration_strategy: "separate migration container"
      health_checks: true
  
  container_specifications:
    backend:
      base_image: "node:22-alpine"
      port: 3001
      health_check: "GET /v1/health"
      environment_variables:
        required: ["DATABASE_URL", "REDIS_URL", "JWT_SECRET"]
        optional: ["LOG_LEVEL", "PORT", "CORS_ORIGIN"]
    
    frontend:
      base_image: "nginx:alpine"
      port: 80
      build_context: "booking-frontend/"
      environment_variables:
        required: ["API_BASE_URL"]
    
    migration:
      base_image: "node:22-alpine"
      command: "npx prisma migrate deploy"
      depends_on: ["postgres"]
  
  ci_cd_pipeline:
    platform: "GitHub Actions"
    workflows:
      - name: "Test and Build"
        triggers: ["push", "pull_request"]
        steps: ["install", "lint", "test", "build", "docker_build"]
      
      - name: "Deploy to Production"
        triggers: ["push to main"]
        steps: ["build", "test", "migration", "deploy", "smoke_test"]
    
    quality_gates:
      - "All tests pass"
      - "Code coverage meets targets"
      - "No security vulnerabilities"
      - "Build successful"
      - "Docker images built successfully"

# ============================================
# 8. Monitoring and Observability Contract
# ============================================

monitoring:
  health_checks:
    endpoint: "/v1/health"
    components: ["database", "redis", "memory", "disk"]
    frequency: "30 seconds"
  
  metrics:
    business_metrics:
      - "bookings.created.count"
      - "bookings.cancelled.count"
      - "users.active.count"
      - "services.available.count"
    
    performance_metrics:
      - "api.response.time.p95"
      - "database.query.duration"
      - "redis.command.duration"
      - "memory.usage.percent"
    
    error_metrics:
      - "errors.http.4xx.count"
      - "errors.http.5xx.count"
      - "errors.database.count"
      - "errors.redis.count"
  
  logging:
    format: "structured JSON"
    levels: ["error", "warn", "info", "debug"]
    transports: ["console", "file", "remote (optional)"]
    fields: ["timestamp", "level", "message", "context", "userId", "requestId"]
  
  alerting:
    conditions:
      - "api.p95_response_time > 1000ms for 5 minutes"
      - "database.connection.errors > 10 in 1 minute"
      - "memory.usage > 90% for 5 minutes"
      - "http.errors.5xx > 1% of requests for 5 minutes"

# ============================================
# 9. Compliance and Constraints
# ============================================

compliance:
  
  # TDD enforcement
  tdd_required: true
  test_first_principle: "No business code without failing test"
  
  # Architecture constraints
  stateless_services: true
  distributed_lock_required: true
  no_local_state_storage: true
  
  # Security constraints
  https_required: true
  sensitive_data_encryption: true
  audit_logging_required: true
  
  # Deployment constraints
  immutable_tags: true
