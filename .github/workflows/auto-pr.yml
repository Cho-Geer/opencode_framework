name: Auto PR — feature → develop
on:
  push:
    branches-ignore:
      - develop
      - main

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: auto-pr-work-one
  cancel-in-progress: false

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Get current branch name
        id: branch
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v6

      - name: Check if PR already exists
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list \
            --base develop \
            --head ${{ steps.branch.outputs.branch }} \
            --json number \
            --jq 'length')
          echo "existing=$existing" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.check-pr.outputs.existing == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base develop \
            --head ${{ steps.branch.outputs.branch }} \
            --title "Auto PR: ${{ steps.branch.outputs.branch }} → develop" \
            --body "Automated PR created by CI from ${{ steps.branch.outputs.branch }} branch push."

      - name: Skip (PR already exists)
        if: steps.check-pr.outputs.existing != '0'
        run: echo "PR already exists, skipping creation."
