name: Auto-Add to Project
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/users/Cho-Geer/projects/2
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
