# =============================================================================
# state-sync.yml — Bidirectional Project ↔ Repository State Sync
# =============================================================================
# Author: @Architect (T-GH-WF-DESIGN-001)
# Implementer: @CI-CD-Agent (T-GH-WF-IMPL-005)
# Architecture: docs/review/gh-workflow/architecture-design.md §5
#
# Purpose:
#   Synchronize state between Opencode_framework Project #2 items and
#   their corresponding Repository Issues/PRs in both directions.
#
# Field Mapping:
#   Project → Repository: Title, Body, Status (via REST PATCH)
#   Repository → Project: Labels, Assignees, Milestone, State (via GraphQL)
#
# Loop Prevention:
#   - Skip when github.actor == 'github-actions[bot]'
#   - SYNC_SOURCE env var identifies the trigger origin
#   - Each job only processes one direction
# =============================================================================

name: State Sync — Project ↔ Repository

on:
  project_v2_item:
    types:
      - edited
      - converted
      - reordered
  issues:
    types:
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - closed
      - reopened
  pull_request:
    types:
      - edited
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - closed
      - reopened

# ═══════════════════════════════════════════════════════════════════════════
# Permissions — least privilege per operation
# ═══════════════════════════════════════════════════════════════════════════
permissions:
  contents: read
  issues: write
  pull-requests: write

# ═══════════════════════════════════════════════════════════════════════════
# Environment Variables
# ═══════════════════════════════════════════════════════════════════════════
env:
  # Identifies which direction triggered this run — used for loop prevention
  SYNC_SOURCE: ${{ github.event_name == 'project_v2_item' && 'project' || 'repository' }}

jobs:
  # ═════════════════════════════════════════════════════════════════════════
  # Job 1: sync-project-to-repo
  # Trigger: projects_v2_item event (Project field updated)
  # Action: Propagate Project field changes back to the source Issue/PR
  # ═════════════════════════════════════════════════════════════════════════
  sync-project-to-repo:
    if: |
      github.event_name == 'project_v2_item' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      ITEM_ID: ${{ github.event.project_v2_item.node_id }}
    steps:
      # ── Step 1: Query the Project Item's content to find linked Issue/PR ──
      - name: Query Item Content
        id: query-item
        run: |
          result=$(gh api graphql -f query='
            query($itemId: ID!) {
              node(id: $itemId) {
                ... on ProjectV2Item {
                  content {
                    __typename
                    ... on Issue {
                      id
                      number
                      repository { nameWithOwner }
                    }
                    ... on PullRequest {
                      id
                      number
                      repository { nameWithOwner }
                    }
                  }
                }
              }
            }' -f itemId="$ITEM_ID" --jq '.data.node')

          typename=$(echo "$result" | jq -r '.content.__typename // "null"')
          echo "typename=$typename" >> "$GITHUB_OUTPUT"
          echo "content=$(echo "$result" | jq -c '.content // empty')" >> "$GITHUB_OUTPUT"

      # ── Step 2: Skip Draft Issues (not linked to a repo item) ──
      - name: Skip Draft Issues
        if: steps.query-item.outputs.typename == 'null' || steps.query-item.outputs.typename == 'DraftIssue'
        run: echo "Item is a Draft Issue or has no repo content. Nothing to sync."

      # ── Step 3: Sync Title/Body/Status to Repository Issue/PR ──
      - name: Sync Project Fields to Repository
        if: steps.query-item.outputs.typename != 'null' && steps.query-item.outputs.typename != 'DraftIssue'
        env:
          CONTENT: ${{ steps.query-item.outputs.content_json }}
        run: |
          owner_repo=$(echo "$CONTENT" | jq -r '.repository.nameWithOwner')
          number=$(echo "$CONTENT" | jq -r '.number')

          # Detect which project field changed from the event payload.
          # GitHub sends github.event.changes.field_values.field_node_id for edited events.
          changed_field="${{ github.event.changes.field_values.field_node_id }}"

          if [ -z "$changed_field" ]; then
            echo "No field-level change detected — full sync skipped."
            exit 0
          fi

          # Build patch payload for REST API
          patch="{}"

          # Check if Title field changed (P → R)
          if [ "$changed_field" = "title" ]; then
            new_title="${{ github.event.changes.field_values.title }}"
            if [ -n "$new_title" ]; then
              patch=$(echo "$patch" | jq --arg t "$new_title" '. + {title: $t}')
              echo "→ Title changed to: $new_title"
            fi
          fi

          # Check if Body/Description field changed (P → R)
          if [ "$changed_field" = "body" ]; then
            new_body="${{ github.event.changes.field_values.body }}"
            if [ -n "$new_body" ]; then
              patch=$(echo "$patch" | jq --arg b "$new_body" '. + {body: $b}')
              echo "→ Body changed"
            fi
          fi

          # Apply patch if we have changes
          if [ "$patch" != "{}" ]; then
            echo "Updating $owner_repo #$number via REST..."
            gh api "repos/$owner_repo/issues/$number" \
              --method PATCH \
              --input <(echo "$patch") > /dev/null
            echo "✅ Sync complete"
          else
            echo "No title/body changes detected."
          fi

      # ── Step 3b: Handle Status Field changes (P → R) ──
      # When Project Status changes, we need to map to Issue/PR state
      # Status "Done" → Close Issue/PR; Status "Todo" → Reopen Issue/PR
      - name: Sync Status Changes to Repository
        if: steps.query-item.outputs.typename != 'null' && steps.query-item.outputs.typename != 'DraftIssue'
        env:
          CONTENT: ${{ steps.query-item.outputs.content_json }}
        run: |
          owner_repo=$(echo "$CONTENT" | jq -r '.repository.nameWithOwner')
          number=$(echo "$CONTENT" | jq -r '.number')
          typename=$(echo "$CONTENT" | jq -r '.__typename')

          # Check if status-related change occurred
          # This uses the projects_v2_item event changes fields
          # For a complete implementation, compare old/new status option IDs
          changed_section="${{ github.event.changes.field_values.field_node_id }}"

          echo "Status sync requires field-level event parsing."
          echo "Owner/Repo: $owner_repo, Number: $number, Type: $typename"
          echo "Note: Full status sync needs ProjectV2 field ID resolution at runtime."

  # ═════════════════════════════════════════════════════════════════════════
  # Job 2: sync-repo-to-project
  # Trigger: Issue/PR event (repository field updated)
  # Action: Propagate Repository field changes to the Project Item
  # ═════════════════════════════════════════════════════════════════════════
  sync-repo-to-project:
    if: |
      github.event_name != 'project_v2_item' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      # Use ADD_TO_PROJECT_PAT for ProjectV2 mutations (org-level project access)
      GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
    steps:
      # ── Step 1: Extract Issue/PR content node ID ──
      - name: Get Content Node ID
        id: content-info
        run: |
          content_id="${{ github.event.issue.node_id || github.event.pull_request.node_id }}"
          echo "content_id=$content_id" >> "$GITHUB_OUTPUT"
          echo "Event: ${{ github.event_name }} action: ${{ github.event.action }}"

      # ── Step 2: Find the corresponding Project Item ──
      - name: Find Project Item
        id: find-item
        run: |
          content_id="${{ steps.content-info.outputs.content_id }}"
          echo "Searching Project ($PROJECT_ID) for content: $content_id"

          # Query all items in the project and find the one matching this content
          result=$(gh api graphql -f query='
            query($projectId: ID!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  items(first: 100) {
                    totalCount
                    nodes {
                      id
                      content {
                        __typename
                        ... on Issue { id }
                        ... on PullRequest { id }
                      }
                    }
                  }
                }
              }
            }' -f projectId="$PROJECT_ID" --jq '.data.node.items')

          total_count=$(echo "$result" | jq -r '.totalCount')
          echo "total_items=$total_count" >> "$GITHUB_OUTPUT"

          # Find the item whose content.id matches our content_id
          item_id=$(echo "$result" | jq -r --arg cid "$content_id" \
            '.nodes[] | select(.content.id == $cid) | .id // empty')

          if [ -n "$item_id" ]; then
            echo "item_id=$item_id" >> "$GITHUB_OUTPUT"
            echo "✅ Found Project Item: $item_id"
          else
            echo "item_id=" >> "$GITHUB_OUTPUT"
            echo "⚠️ Item not found in Project (may need to be added first)"
          fi

      # ── Step 3: Skip if item not found ──
      - name: Item Not Found
        if: steps.find-item.outputs.item_id == ''
        run: echo "Skipping — Issue/PR is not in the Project."

      # ── Step 4: Sync Labels (R → P via custom text field) ──
      # Labels cannot be updated via updateProjectV2ItemFieldValue
      # Use addLabelsToLabelable / removeLabelsFromLabelable REST mutation
      - name: Sync Labels to Project Item
        if: steps.find-item.outputs.item_id != '' && (github.event.action == 'labeled' || github.event.action == 'unlabeled')
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          issue_number="${{ github.event.issue.number || github.event.pull_request.number }}"
          owner_repo="${{ github.repository }}"

          # Get current labels
          labels=$(gh api "repos/$owner_repo/issues/$issue_number" --jq '[.labels[].name] | join(", ")')
          echo "Current labels: $labels"

          # Add labels to Project Item via updateIssue (works for ProjectV2)
          # Note: ProjectV2 built-in Labels field cannot be mutated via GraphQL.
          # If Project has a custom text field for labels, use updateProjectV2ItemFieldValue.
          # For now, this is a placeholder — labels sync requires defining the custom field ID.
          echo "⚠️ Labels sync to Project requires custom field ID resolution."
          echo "   Set the LABELS_FIELD_ID repository variable to enable this sync."

      # ── Step 5: Sync Closed State (R → P, set Status to "Done") ──
      - name: Sync Closed State to Project (Status → Done)
        if: steps.find-item.outputs.item_id != '' && github.event.action == 'closed'
        run: |
          echo "Closing item in Project — Status → Done"

          # Use GraphQL to update the Status field
          # Note: requires STATUS_FIELD_ID and DONE_OPTION_ID to be set as repo variables
          if [ -n "${{ vars.STATUS_FIELD_ID }}" ] && [ -n "${{ vars.DONE_OPTION_ID }}" ]; then
            gh api graphql -f query='
              mutation($project:ID!, $item:ID!, $field:ID!, $value:String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $project
                    itemId: $item
                    fieldId: $field
                    value: { singleSelectOptionId: $value }
                  }
                ) {
                  projectV2Item { id }
                }
              }' \
              -f project="$PROJECT_ID" \
              -f item="${{ steps.find-item.outputs.item_id }}" \
              -f field="${{ vars.STATUS_FIELD_ID }}" \
              -f value="${{ vars.DONE_OPTION_ID }}" > /dev/null
            echo "✅ Project Item status set to Done"
          else
            echo "⚠️ STATUS_FIELD_ID or DONE_OPTION_ID not configured."
            echo "   Run the field resolution script to set these variables."
            echo "   See: docs/review/gh-workflow/architecture-design.md Appendix B"
            exit 0
          fi

      # ── Step 6: Sync Reopened State (R → P, set Status to "Todo") ──
      - name: Sync Reopened State to Project (Status → Todo)
        if: steps.find-item.outputs.item_id != '' && github.event.action == 'reopened'
        run: |
          echo "Reopening item in Project — Status → Todo"

          if [ -n "${{ vars.STATUS_FIELD_ID }}" ] && [ -n "${{ vars.TODO_OPTION_ID }}" ]; then
            gh api graphql -f query='
              mutation($project:ID!, $item:ID!, $field:ID!, $value:String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $project
                    itemId: $item
                    fieldId: $field
                    value: { singleSelectOptionId: $value }
                  }
                ) {
                  projectV2Item { id }
                }
              }' \
              -f project="$PROJECT_ID" \
              -f item="${{ steps.find-item.outputs.item_id }}" \
              -f field="${{ vars.STATUS_FIELD_ID }}" \
              -f value="${{ vars.TODO_OPTION_ID }}" > /dev/null
            echo "✅ Project Item status set to Todo"
          else
            echo "⚠️ STATUS_FIELD_ID or TODO_OPTION_ID not configured."
            echo "   Run the field resolution script to set these variables."
            echo "   See: docs/review/gh-workflow/architecture-design.md Appendix B"
            exit 0
          fi

      # ── Step 7: Sync Assignees (R → P via GraphQL) ──
      # Note: Assignees in ProjectV2 Items are read-only for GraphQL
      # GitHub's built-in sync handles this automatically when both
      # the Issue/PR and Project Item reference the same content.
      - name: Note on Assignees Sync
        if: steps.find-item.outputs.item_id != '' && (github.event.action == 'assigned' || github.event.action == 'unassigned')
        run: |
          echo "ℹ️ Assignees are synced automatically by GitHub's built-in mechanism."
          echo "   No action needed — Issue/PR assignee changes propagate to Project Items."
