# ═══════════════════════════════════════════════════════════════
# Framework CI Pipeline — OpenCode Framework Integrity Check
# ═══════════════════════════════════════════════════════════════
# Purpose: Runs the OpenCode framework self-test to validate
# plugin integrity, rule registry, template resolution, and
# UC7KS pipeline compliance on every push/PR to main/develop.
#
# TOOLCHAIN JUSTIFICATION:
# - GitHub Actions: Primary CI orchestrator (native to GitHub,
#   single-tool CI/CD with branch protection integration).
#   No additional orchestration tools required for this scope.
#
# PRE-COMMIT VALIDATION CHECKLIST:
# [x] Rule 1: CI-only workflow, no CD/deploy steps
# [x] Rule 2: Quality gates on every job, zero continue-on-error
# [x] Rule 3: Single-tool (GitHub Actions), justification above
# [x] Rule 4: IaC committed (Dockerfile, compose in repo)
# [x] Rule 5: No hardcoded secrets
# [x] Rule 6: Structured output on every job
# [x] Rule 7: timeout-minutes ≤ 15 on every job
# ═══════════════════════════════════════════════════════════════

name: Framework CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: framework-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  CI: true

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1: framework-self-test
  # Runs the OpenCode framework self-test to validate plugin
  # integrity, rule registry, template resolution, and UC7KS
  # pipeline compliance. Ensures framework modifications do not
  # break the multi-agent system.
  # ────────────────────────────────────────────────────────────
  framework-self-test:
    name: Framework Self-Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Pre-flight setup
        run: |
          chmod +x .opencode/scripts/reconciliation-check.sh .opencode/scripts/pre-execution-gate.ts
          git config core.hooksPath .opencode/hooks
          mkdir -p .opencode/state
          bun -e "
            const {Database} = require('bun:sqlite');
            const db = new Database('.opencode/state/framework-state.db', {create: true});
            db.run('CREATE TABLE IF NOT EXISTS substate_kv (key TEXT PRIMARY KEY, json TEXT NOT NULL, updated_at INTEGER NOT NULL)');
            const now = Date.now();
            const states = {
              eslint_state: {modules:{}, aggregate:{total_violations:0, dirty_modules:[], waived_modules:[]}},
              type_check_state: {status:'clean', dirty_files:[], last_checked:null, errors:[]},
              dependency_state: {status:'clean', dirty_files:[], last_checked:null, packages:{}},
              format_state: {status:'clean', dirty_files:[], last_checked:null, formatter:'prettier'},
              write_audit_state: {sessions:{}, history:[]},
              knowledge_cache_state: {cache_status:'empty', total_entries:0, last_index_check:null, last_fetch_at:null, compliance:{}, pipeline_integrity:{}, session_access:{}, total_docs_count:0, total_size_bytes:0, last_verified:null},
              compliance_records: {role_violations:[], gate_violations:[], tdd_violations:[], super_admin_dispatch_bypasses:[], orchestrator_sa_dispatches:[]},
              knowledge_audit_state: {last_audit:null, total_accesses:0, coverage_score:0},
              tdd_enforcement_state: {enabled:true, current_session:{}, violations:[], history:[]},
              keystone_hashes: {},
              transaction_state: {last_operation_id:null, last_transaction_at:null, pending_operations:[]},
              knowledge_state: {domains_covered:[], last_updated:null, coverage_score:0},
              config_read_state: {sessions:{}}
            };
            const stmt = db.prepare('INSERT OR REPLACE INTO substate_kv (key, json, updated_at) VALUES (?, ?, ?)');
            for (const [key, val] of Object.entries(states)) {
              stmt.run(key, JSON.stringify(val), now);
            }
            db.close();
            console.log('✅ All 13 sub-states initialized');
          "

      - name: Run framework self-test
        run: bun .opencode/scripts/framework-self-test.ts

      - name: Export check result
        if: always()
        run: |
          echo "{\"check\":\"framework-self-test\",\"status\":\"${{ job.status }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > /tmp/framework-self-test-result.json
          cat /tmp/framework-self-test-result.json

  # ────────────────────────────────────────────────────────────
  # JOB 2: ci-status-summary
  # Aggregates all job results into a single status gate.
  # This job is used as the required status check in branch
  # protection rules.
  # ────────────────────────────────────────────────────────────
  ci-status-summary:
    name: CI Status Summary
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs:
      - framework-self-test

    steps:
      - name: Check all jobs passed
        run: |
          echo "══════════════════════════════════════════════════"
          echo " Framework CI Pipeline Summary"
          echo "══════════════════════════════════════════════════"
          echo ""
          echo "  framework-self-test: ${{ needs.framework-self-test.result }}"
          echo ""

          # Fail if any job failed or was cancelled
          if [ "${{ needs.framework-self-test.result }}" = "failure" ]; then
            echo "::error::Framework self-test failed"
            exit 1
          fi

          if [ "${{ needs.framework-self-test.result }}" = "cancelled" ]; then
            echo "::error::Framework self-test was cancelled"
            exit 1
          fi

          echo "✅ All framework CI checks passed"
