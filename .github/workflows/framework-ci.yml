# ═══════════════════════════════════════════════════════════════
# Framework CI Checks — OpenCode Multi-Agent System
# ═══════════════════════════════════════════════════════════════
# Purpose: Enforce framework operational integrity on every push
# and PR to main/develop branches. Four independent checks validate
# Git hooks, line endings, rule digest consistency, and WAL
# transaction integrity. Any failure blocks PR merge.
#
# TOOLCHAIN JUSTIFICATION:
# - GitHub Actions: Primary CI orchestrator (native to GitHub,
#   single-tool CI/CD with branch protection integration).
#   No additional orchestration tools required for this scope.
#
# PRE-COMMIT VALIDATION CHECKLIST:
# [x] Rule 1: CI-only workflow, no CD/deploy steps
# [x] Rule 2: 4 quality gates, zero continue-on-error flags
# [x] Rule 3: Single-tool (GitHub Actions), justification above
# [x] Rule 4: IaC committed (Dockerfile, compose in repo)
# [x] Rule 5: No hardcoded secrets
# [x] Rule 6: Structured output on every job
# [x] Rule 7: timeout-minutes ≤ 5 on every job
# ═══════════════════════════════════════════════════════════════

name: Framework CI Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Prevent concurrent runs on the same ref (cancel in-progress for
# push; queue for PR to avoid stale status checks)
concurrency:
  group: framework-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1: hook-path-check
  # Verifies that the repository's git hooksPath is configured
  # to .opencode/hooks, ensuring framework hook enforcement
  # (commit-msg, pre-commit) is active for all contributors.
  # ────────────────────────────────────────────────────────────
  hook-path-check:
    name: Hook Path Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure and verify git hooks path
        run: |
          git config core.hooksPath .opencode/hooks
          HOOKS_PATH=$(git config core.hooksPath)
          echo "Resolved core.hooksPath: ${HOOKS_PATH}"
          if [ "${HOOKS_PATH}" != ".opencode/hooks" ]; then
            echo "::error::Failed to set core.hooksPath to .opencode/hooks"
            echo "::error::Framework hook enforcement (commit-msg, pre-commit) may not be active."
            exit 1
          fi
          echo "::notice::core.hooksPath correctly set to .opencode/hooks"

      - name: Verify hook files are executable
        run: |
          MISSING=""
          for hook in .opencode/hooks/commit-msg .opencode/hooks/pre-commit; do
            if [ ! -x "$hook" ]; then
              echo "::error::$hook is not executable"
              MISSING="${MISSING} $hook"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Non-executable hooks:${MISSING}"
            exit 1
          fi
          echo "::notice::All hook files are executable"

      - name: Export check result
        if: always()
        run: |
          echo "{\"check\":\"hook-path-check\",\"status\":\"${{ job.status }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > /tmp/hook-path-result.json
          cat /tmp/hook-path-result.json

  # ────────────────────────────────────────────────────────────
  # JOB 2: lf-check
  # Scans all .sh files in the repository for CRLF (Windows-style)
  # line endings using the `file` command. Shell scripts with
  # CRLF endings can cause obscure failures on Unix runners
  # and in Docker containers.
  # ────────────────────────────────────────────────────────────
  lf-check:
    name: Line Ending Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan .sh files for CRLF line endings
        run: |
          echo "Scanning all .sh files for CRLF line endings..."

          # Find .sh files (excluding node_modules and .git),
          # run `file` on each, grep for CRLF terminators
          CRLF_FILES=$(find . -name "*.sh" -type f \
            ! -path "*/node_modules/*" \
            ! -path "*/.git/*" \
            -exec file {} \; 2>/dev/null | grep -i "CRLF" || true)

          if [ -n "$CRLF_FILES" ]; then
            echo "::error::The following .sh files contain CRLF line endings:"
            echo "$CRLF_FILES"
            echo ""
            echo "::error::Fix: Run 'dos2unix' on these files or configure"
            echo "::error::your editor/IDE to use LF line endings for shell scripts."
            exit 1
          fi

          # Also report file count for observability
          FILE_COUNT=$(find . -name "*.sh" -type f \
            ! -path "*/node_modules/*" \
            ! -path "*/.git/*" | wc -l)
          echo "::notice::Scanned ${FILE_COUNT} .sh files — all LF clean"

      - name: Export check result
        if: always()
        run: |
          echo "{\"check\":\"lf-check\",\"status\":\"${{ job.status }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > /tmp/lf-check-result.json
          cat /tmp/lf-check-result.json

  # ────────────────────────────────────────────────────────────
  # JOB 3: critical-files-check
  # Validates that no critical infrastructure files have been
  # modified without being committed (git diff HEAD check).
  # FIX-007 (2026-06-21 @Super-Admin): Replaced static shell array
  # with Bun script that imports the canonical CRITICAL_FILES list
  # from .opencode/lib/critical-files.ts — the single source of truth
  # also used by hook-commit-msg.ts and the pre-commit hook.
  # ────────────────────────────────────────────────────────────
  critical-files-check:
    name: Critical Files Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check critical infrastructure files (canonical list)
        run: |
          echo "Running ci-critical-files-check.ts (imports .opencode/lib/critical-files.ts)..."
          bun .opencode/scripts/ci-critical-files-check.ts

      - name: Export check result
        if: always()
        run: |
          echo "{\"check\":\"digest-check\",\"status\":\"${{ job.status }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > /tmp/digest-check-result.json
          cat /tmp/digest-check-result.json

  # ────────────────────────────────────────────────────────────
  # JOB 4: wal-check
  # Runs state-transaction.js verify to validate the Write-Ahead
  # Log (WAL) transaction integrity. Detects incomplete or
  # corrupted state machine transactions that could cause
  # framework state drift between environments.
  # ────────────────────────────────────────────────────────────
  wal-check:
    name: WAL Transaction Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify WAL transaction integrity
        run: |
          echo "Running state-transaction.ts verify..."
          bun .opencode/scripts/state-transaction.ts verify

      - name: Export check result
        if: always()
        run: |
          echo "{\"check\":\"wal-check\",\"status\":\"${{ job.status }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > /tmp/wal-check-result.json
          cat /tmp/wal-check-result.json

  # ────────────────────────────────────────────────────────────
  # JOB 5: semantic-validator (FIX-008 + FIX-CI-ENVIRONMENT)
  # Runs CI-level semantic validation that mirrors the local
  # pre-commit/commit-msg hook policy. This is the remote-side
  # answer to raw `git commit --no-verify` that no local hook
  # can intercept. Checks: [INFRA] markers, mode downgrades,
  # hook invariants, framework self-test.
  #
  # FIX-CI-ENVIRONMENT (2026-06-22): Added bun install (dependency
  # resolution for substate_kv DB access), chmod +x for shell scripts
  # (reconciliation-check.sh, pre-execution-hook.sh lose exec bit
  # after git checkout), and DB init step to ensure the substate_kv
  # table exists before framework-self-test runs.
  # ────────────────────────────────────────────────────────────
  semantic-validator:
    name: Semantic Validator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Restore script executability (git checkout strips exec bit)
        run: |
          echo "Restoring execute permissions on framework scripts..."
          chmod +x .opencode/scripts/reconciliation-check.sh 2>/dev/null || echo "(reconciliation-check.sh — skipping)"
          chmod +x .opencode/scripts/pre-execution-hook.sh 2>/dev/null || echo "(pre-execution-hook.sh — skipping)"
          chmod +x .opencode/scripts/pre-execution-gate.ts 2>/dev/null || echo "(pre-execution-gate.ts — skipping)"
          chmod +x .opencode/scripts/framework-self-test.ts 2>/dev/null || echo "(framework-self-test.ts — skipping)"
          chmod +x .opencode/scripts/framework-doctor.ts 2>/dev/null || echo "(framework-doctor.ts — skipping)"
          chmod +x .opencode/scripts/ci-semantic-validator.ts 2>/dev/null || echo "(ci-semantic-validator.ts — skipping)"
          chmod +x .opencode/hooks/pre-commit 2>/dev/null || echo "(pre-commit — skipping)"
          chmod +x .opencode/hooks/commit-msg 2>/dev/null || echo "(commit-msg — skipping)"
          echo "Script executability restored."

      - name: Configure git hooks path for framework checks
        run: |
          git config core.hooksPath .opencode/hooks
          echo "core.hooksPath set to: $(git config core.hooksPath)"

      - name: Initialize framework state DB
        run: bun .opencode/scripts/db-migrate.ts

      - name: Run CI semantic validator
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "Running ci-semantic-validator.ts..."
          if [ -n "$PR_BASE_SHA" ] && [ "$PR_BASE_SHA" != "null" ]; then
            echo "PR context: checking commits from base ${PR_BASE_SHA} to HEAD"
            bun .opencode/scripts/ci-semantic-validator.ts --base "${PR_BASE_SHA}"
          else
            echo "Push context: checking commits from HEAD~5 to HEAD"
            bun .opencode/scripts/ci-semantic-validator.ts --range HEAD~5..HEAD
          fi

      - name: Export check result
        if: always()
        run: |
          echo "{\"check\":\"semantic-validator\",\"status\":\"${{ job.status }}\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > /tmp/semantic-validator-result.json
          cat /tmp/semantic-validator-result.json
